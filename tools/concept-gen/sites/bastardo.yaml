t:
  pt:
    eyebrow: "Bar de vinhos · Cascais"
    h1: "Cada copo conta <em>a história de um pequeno produtor</em>."
    lede: "Vinhos portugueses de todos os estilos, de curtimenta a generosos, a copo e à garrafa, com enchidos e queijos portugueses. Perto da baía de Cascais."
    cta1: "Reservar mesa"
    cta_short: "Reservar"
    cta2: "Ver a carta"
    nav_menu: "Carta"
    art_tag_b: "Ramisco de Colares"
    art_tag: "vinha em chão de areia, junto ao Atlântico"
    menu_k: "Carta"
    menu_h: "Esta semana, a copo"
    menu_p: "Brancos, tintos, rosés, palhetes, curtimentas, espumantes e generosos. A carta muda; o site mostraria sempre a desta semana."
    menu_note: "Preços segundo a Time Out (outubro de 2026)."
    about_h: "Um nome de casta"
    about_p:
      - "O nome vem da casta Bastardo e dos vinhos que fogem ao circuito comercial. A missão é devolver valor ao pequeno produtor; para já, só portugueses."
      - "A ideia foi da Bia Lobato, com o Miguel Costa e o sommelier João Diaz, que passou pelo Calma, em Lisboa. Estão a preparar provas guiadas e venda de garrafas para levar."
    hours_note: "Horário segundo a Time Out (outubro de 2026)."
    form_h: "Reservar mesa ou prova"
    form_p: "Escolha o dia, a hora e quantas pessoas. Para uma prova em grupo, diga nas notas. A mensagem fica pronta para enviar pelo Instagram."
    ph_notes: "Uma prova para um grupo? Um vinho que quer provar?"
    foot_p: "Bar de vinhos de pequenos produtores portugueses, perto da baía de Cascais."
    og_desc: "Conceito de site para o Bastardo, bar de vinhos em Cascais: a carta da semana, horário e reservas."
  en:
    eyebrow: "Wine bar · Cascais"
    h1: "Every glass tells <em>a small producer's story</em>."
    lede: "Portuguese wines of every style, from skin-contact to fortified, by the glass and bottle, with Portuguese charcuterie and cheese. Near Cascais bay."
    cta1: "Book a table"
    cta_short: "Book"
    cta2: "See the list"
    nav_menu: "Wine list"
    art_tag_b: "Colares Ramisco"
    art_tag: "vines in sand, by the Atlantic"
    menu_k: "Wine list"
    menu_h: "This week, by the glass"
    menu_p: "Whites, reds, rosés, palhetes, orange, sparkling and fortified. The list changes; the site would always show this week's."
    menu_note: "Prices as published by Time Out (October 2026)."
    about_h: "Named after a grape"
    about_p:
      - "The name comes from the Bastardo grape and from wines outside the commercial mainstream. The mission is to give value back to small producers; for now, Portuguese only."
      - "It was Bia Lobato's idea, with Miguel Costa and sommelier João Diaz, formerly of Calma in Lisbon. Guided tastings and bottles to take away are on the way."
    hours_note: "Hours as published by Time Out (October 2026)."
    form_h: "Book a table or tasting"
    form_p: "Choose the day, time and party size. For a group tasting, say so in the notes. The message is ready to send on Instagram."
    ph_notes: "A tasting for a group? A wine you'd like to try?"
    foot_p: "Small-producer Portuguese wine bar near Cascais bay."
