t:
  pt:
    eyebrow: "Peixaria e oyster bar · Estoril"
    h1: "Peixe de Peniche, <em>ostras e um copo de vinho</em>, ao pé da praia."
    lede: "Peixaria de bairro e oyster bar no Largo Amália Rodrigues, a dois passos da Praia da Poça. Leva-se para casa ou come-se ali, na esplanada."
