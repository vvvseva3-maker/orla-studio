    about_p:
      - "A Peixaria da Poça abriu em dezembro de 2025, pela mão da Ágata e do Diogo dos Santos, o casal da florista Flores da Poça. O irmão do Diogo, Alexandre, escolhe o peixe."
      - "O peixe e o marisco chegam todos os dias da zona de Peniche, uma homenagem às memórias de infância dos irmãos. Em 45 m² cabem a banca, o balcão das ostras e 22 lugares."
    hours_note: "Horário segundo a Time Out e a NiT (junho de 2026)."
    form_h: "Encomendar para levantar"
    form_p: "Diga o que quer e para que dia, e o peixe fica guardado. A mensagem fica pronta para enviar pelo Instagram, ou ligue para o 965 446 417."
    foot_p: "Peixaria e oyster bar no Estoril, a dois passos da Praia da Poça."
    og_desc: "Conceito de site para a Peixaria da Poça, no Estoril: o balcão do dia, preços, horário e encomendas."
