t:
  pt:
    eyebrow: Cozinha turca · Cascais
    h1: Cozinha caseira de Istambul, <em>ao lado do jardim</em>.
    lede: Borrego assado durante horas, mezze, börek e baklava. No fim, café turco e uma partida de gamão.
    cta1: Reservar mesa
    cta_short: Reservar
    art_tag_b: Kokini
    art_tag: o nome vem da mãe do dono e das suas bochechas coradas
    menu_k: Menu
    menu_h: Da época, como em casa
    menu_p: A carta muda com as estações. Há carnes que assam três a quatro horas antes de chegarem à mesa.
    menu_note: Preços segundo a Time Out (agosto de 2026). No site final, a carta seria atualizada pela própria casa.
    about_h: Um restaurante com nome de mãe
    about_p:
      - O Kokini abriu em 2025, pela mão de A. Turgay Gülay, antigo realizador e argumentista de Istambul. A cozinha é caseira e da época, com influências otomanas, da Anatólia, do Egeu e do Levante.
      - O nome é uma homenagem à mãe do dono, antiga lançadora de disco, conhecida pelas bochechas coradas. A sala foi desenhada pela filha, a arquiteta Elif Deniz Gülay, com fotografias de Istambul a preto e branco.
    hours_note: Horário segundo a Time Out (agosto de 2026).
    form_h: Reservar mesa
    form_p: Escolha o dia, a hora e quantas pessoas. A mensagem fica pronta para enviar ao Kokini pelo Instagram.
    foot_p: Cozinha turca caseira em Cascais, ao lado do jardim do Largo Maestro Taborda.
    og_desc: Conceito de site para o Kokini, cozinha turca em Cascais. Menu, horário e reservas.
  en:
    eyebrow: Turkish kitchen · Cascais
    h1: Istanbul home cooking, <em>right by the park</em>.
    lede: Lamb roasted for hours, mezze, börek and baklava. Then Turkish coffee and a game of backgammon.
    cta1: Book a table
    cta_short: Book
    art_tag_b: Kokini
    art_tag: named after the owner's mother and her rosy cheeks
    menu_k: Menu
    menu_h: Seasonal, like at home
    menu_p: The menu changes with the seasons. Some meats roast for three to four hours before they reach the table.
    menu_note: Prices as published by Time Out (August 2026). On the real site the owners would keep the menu up to date.
    about_h: A restaurant named after a mother
    about_p:
      - Kokini opened in 2025, run by A. Turgay Gülay, a former film director and screenwriter from Istanbul. The cooking is homely and seasonal, with Ottoman, Anatolian, Aegean and Levantine roots.
      - The name honours the owner's mother, a former discus thrower known for her rosy cheeks. The room was designed by his daughter, architect Elif Deniz Gülay, with black-and-white photos of Istanbul.
    hours_note: Hours as published by Time Out (August 2026).
    form_h: Book a table
    form_p: Choose the day, time and party size. The message is ready to send to Kokini on Instagram.
    foot_p: Turkish home cooking in Cascais, by the park at Largo Maestro Taborda.
    og_desc: Website concept for Kokini, Turkish cooking in Cascais. Menu, hours and bookings.
