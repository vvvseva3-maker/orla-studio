<body data-page="home">
<main id="main">
<section class="hero" id="top">
  <div class="hero-top wrap">
    <p class="lede" id="lede">Motas usadas em São Domingos de Rana, Cascais. Escolha pela sua carta.</p>
    <div class="hero-acts">
      <a class="btn" href="motas/" data-en="See bikes">Ver motas</a>
      <a class="link" href="tel:+351214444116" data-en="Call 214 444 116">Ligar 214 444 116</a>
    </div>
  </div>
  <div class="hero-stage" id="stage"></div>
  <h1 class="monument" id="monument" data-fit><span class="sr-only" data-en="Speed Master, used motorcycles in Cascais">Speed Master, motas usadas em Cascais</span><span aria-hidden="true">SPEED<br class="m-br"> MASTER</span></h1>
</section>

<section class="sec wrap" aria-labelledby="lic-h">
  <div class="head-row"><h2 class="sec-head" id="lic-h" data-en="Which licence do you have?">Que carta tem?</h2></div>
  <div class="tiles" id="tiles"></div>
</section>

<section class="sec wrap" aria-labelledby="feat-h">
  <div class="head-row"><h2 class="sec-head" id="feat-h" data-en="Featured">Em destaque</h2><a class="link" id="see-all" href="motas/">Ver todas</a></div>
  <div class="cards" id="feat"></div>
</section>

<section class="night band" aria-label="Visite o stand" data-en-aria-label="Visit the showroom">
  <div class="wrap grid">
    <p class="status" data-status></p>
    <a class="phone nums" href="tel:+351214444116">214 444 116</a>
    <p class="where"><span data-en="EN 249-4, km 6.6, São Domingos de Rana.">EN 249-4, km 6,6, São Domingos de Rana.</span> <a class="link" href="contactos/" data-en="Directions and hours">Como chegar e horário</a></p>
  </div>
</section>
</main>

<script src="assets/stock-seed.js"></script>
<script src="assets/store.js"></script>
<script src="assets/site.js"></script>
<script>
(() => {
  const { $, t, card, num, onLang, LIC_MAX } = SMI;
  requestAnimationFrame(() => $('#monument').classList.add('in'));
  function render() {
    const L = t(), all = SM.all().filter((b) => b.status !== 'sold'), ccs = all.map((b) => b.cc).filter(Boolean);
    if (all.length) $('#lede').textContent = L.lede(all.length, Math.min(...ccs), num(Math.max(...ccs)));
    $('#tiles').innerHTML = ['AM', 'B', 'A2', 'A'].map((k) => `
      <a class="tile" href="motas/?carta=${k}"><span class="tile-k">${k}</span><span class="tile-d">${L.licDesc[k]}</span><span class="tile-n">${L.bikes(all.filter((b) => SM.LIC[b.lic] <= LIC_MAX[k]).length)}</span></a>`).join('');
    const feat = all.filter((b) => b.featured);
    $('#feat').innerHTML = (feat.length ? feat : all).slice(0, 6).map(card).join('');
    $('#see-all').textContent = L.seeAll(all.length);
    SM.hydrate($('#feat'));
  }
  onLang(render);
  addEventListener('sm:change', render);
})();
</script>
<script type="module">
const hasGL = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } })();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (hasGL) {
  import('./assets/hero3d.js')
    .then((m) => m.initHero({ stage: document.getElementById('stage'), plinth: document.getElementById('monument'), src: window.SITE.model, reduced }))
    .then(() => document.getElementById('top').classList.add('is-3d'))
    .catch((err) => console.warn('[speedmaster 3d]', err));
}
</script>
</body>
</html>
