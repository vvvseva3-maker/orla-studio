<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LETO Café Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Prata&display=swap">
<style>
:root{
  --paper:#fbfaf7; --paper-2:#f3f1ec; --card:#ffffff; --ink:#171614; --ink-2:#3f3b35; --muted:#6d685f; --line:#e3dfd7; --line-2:#cbc6bc;
  --blue:#1f45c4; --on-blue:#ffffff; --blue-soft:rgba(31,69,196,.06);
  --sun:#f3b52b; --tint:#f8e4b6; --shade:rgba(40,34,24,.2); --tom:#d8452a; --open:#1e7a48; --err:#b3261e;
  --foot:#161513; --on-foot:#f3f0ea; --on-foot-muted:#a39e94;
  --display:'Prata','Didot','Bodoni 72',Georgia,serif;
  --sans:'Jost','Futura','Avenir Next',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --hdr:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121211; --paper-2:#191917; --card:#1c1c1a; --ink:#f0ede6; --ink-2:#d0ccc3; --muted:#9b968c; --line:#2c2b28; --line-2:#45433e;
  --blue:#93a9ff; --on-blue:#0e1222; --blue-soft:rgba(147,169,255,.08);
  --sun:#f3b52b; --tint:#9a7024; --shade:rgba(0,0,0,.5); --tom:#ff6f52; --open:#4cc184; --err:#ff8a80;
  --foot:#0a0a09; --on-foot:#ece8e0; --on-foot-muted:#8f8a80;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#121211; --paper-2:#191917; --card:#1c1c1a; --ink:#f0ede6; --ink-2:#d0ccc3; --muted:#9b968c; --line:#2c2b28; --line-2:#45433e;
  --blue:#93a9ff; --on-blue:#0e1222; --blue-soft:rgba(147,169,255,.08);
  --sun:#f3b52b; --tint:#9a7024; --shade:rgba(0,0,0,.5); --tom:#ff6f52; --open:#4cc184; --err:#ff8a80;
  --foot:#0a0a09; --on-foot:#ece8e0; --on-foot-muted:#8f8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 16px + env(safe-area-inset-top, 0px))}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:400;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
em{font-style:normal;color:var(--blue)}
.wrap{max-width:1240px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.eb{font:500 12px/1.3 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.h2{font-size:clamp(34px,4.4vw,56px);line-height:1.05;margin-top:16px}
.lead{font-size:18px;color:var(--ink-2);max-width:52ch;margin-top:18px}
.sec{padding-block:clamp(72px,9vw,120px)}
.alt{background:var(--paper-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.on .dot,.dot.on{background:var(--open);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,122,72,.45)}70%{box-shadow:0 0 0 8px rgba(30,122,72,0)}100%{box-shadow:0 0 0 0 rgba(30,122,72,0)}}
@media (prefers-reduced-motion: reduce){ .on .dot,.dot.on{animation:none} }

/* concept ribbon */
.rib{background:var(--foot);color:var(--on-foot);font-size:13px;line-height:1.45}
.rib .wrap{padding-block:9px;display:flex;gap:12px;justify-content:center;align-items:center;text-align:center}
.rib b{font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:10.5px;border:1px solid currentColor;padding:3px 7px;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:28px;height:var(--hdr)}
.logo{display:flex;align-items:baseline;gap:12px;text-decoration:none;flex:none}
.logo span{font:400 25px/1 var(--display);letter-spacing:.2em}
.logo small{font:500 10.5px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:28px;margin-left:auto}
.nav a{text-decoration:none;font-size:15px;color:var(--ink-2);padding-block:6px;border-bottom:1px solid transparent}
.nav a:hover{color:var(--ink);border-color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;cursor:pointer;font:500 12.5px/1 var(--sans);letter-spacing:.12em;padding:9px 6px;color:var(--muted);border-bottom:1px solid transparent}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font:500 13px/1.1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;border-radius:0;text-align:center;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{min-height:42px;padding:0 18px;font-size:12px}
.btn.wide{width:100%}
@media (max-width:940px){ .nav{display:none} .lang{margin-left:auto} .hdr-in{gap:12px} }
@media (max-width:420px){ .logo small{display:none} .hdr .btn{padding:0 12px;letter-spacing:.08em} .lang button{padding:9px 4px} }

/* hero */
.hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(32px,5vw,80px);align-items:center;padding-block:clamp(40px,6vw,84px) clamp(36px,4vw,56px)}
.hero h1{font-size:clamp(54px,8.6vw,126px);line-height:.95;margin-top:24px}
.hero .lead{font-size:19px;margin-top:26px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.hero-art{margin:0;width:100%;max-width:560px;justify-self:end}
.strip{list-style:none;margin:0;padding:20px 0 28px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 0}
.strip li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2);padding-right:22px;margin-right:22px;border-right:1px solid var(--line)}
.strip li:last-child{border:0;margin:0;padding:0}
.strip .status{color:var(--ink);font-weight:500}
@media (max-width:860px){ .hero-in{grid-template-columns:1fr} .hero-art{justify-self:center;max-width:460px} }
@media (max-width:560px){ .strip li{border:0;padding:0;margin-right:18px} .ctas .btn{flex:1 1 220px} }

/* line drawings */
.ill{display:block;width:100%;height:auto;overflow:visible}
.ill *{vector-effect:non-scaling-stroke}
.ill .k{fill:none;stroke:var(--ink);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.ill .p{fill:var(--paper);stroke:var(--ink);stroke-width:1.35;stroke-linejoin:round}
.ill .pk{fill:var(--paper);stroke:var(--ink);stroke-width:2.6}
.ill .p0{fill:var(--paper)}
.ill .t{fill:var(--tint);stroke:var(--ink);stroke-width:1.35}
.ill .t0{fill:var(--tint)}
.ill .y{fill:var(--sun);stroke:var(--ink);stroke-width:1.2}
.ill .b{fill:var(--blue)}
.ill .r0{fill:var(--tom);fill-opacity:.15}
.ill .i{fill:var(--ink)}
.ill .hl{fill:#fff;opacity:.75}
.ill .gl{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.55}
.ill .dp{fill:none;stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:2 7;stroke-linecap:round}
.ill .do{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round}
.ill .dt{fill:var(--paper);stroke:var(--blue);stroke-width:2}
.ill .dw{fill:none;stroke:var(--line-2);stroke-width:1.2;stroke-linecap:round}
.ill .dr{stroke:var(--ink);stroke-width:1.35;stroke-linecap:round}

/* calçada band */
.calc{height:52px;line-height:0;overflow:hidden;border-block:1px solid var(--line)}
.calc svg{display:block;width:100%;height:100%}
.cs-gl{fill:var(--line)} .cs-gd{fill:var(--paper)} .cs-l{fill:var(--paper)} .cs-d{fill:var(--ink)}

/* menu + order */
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:clamp(32px,5vw,72px);align-items:start}
.menu-main{min-width:0}
.live{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:15px;color:var(--ink-2)}
.sub{font:500 12px/1.3 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:56px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}
.dish{background:var(--card);border:1px solid var(--line);padding:18px 22px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dish .art{width:100%;max-width:100%;aspect-ratio:1;padding:4px 18px 10px}
.dish h3{font-size:26px;line-height:1.1}
.dish p{font-size:15px;color:var(--muted);line-height:1.5;flex:1}
.dish .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.price{font:500 17px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.add{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .2s,color .2s}
.add svg{width:14px;height:14px}
.add:hover{background:var(--ink);color:var(--paper)}
.add[data-n]:not([data-n="0"]){background:var(--ink);color:var(--paper)}
.add[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--blue);color:var(--on-blue);font:600 11px/20px var(--sans);text-align:center;padding:0 5px}
.add.sm{width:34px;height:34px}
.mgroup{margin-top:60px}
.mgroup h3{display:flex;align-items:baseline;gap:14px;font-size:30px;line-height:1.15;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.mgroup h3 small{font:400 .62em/1 var(--display);color:var(--blue);min-width:1.6em}
.mgroup ul{list-style:none;margin:0;padding:0}
.mi{padding-block:16px;border-bottom:1px solid var(--line)}
.mi-top{display:flex;align-items:center;gap:12px}
.mi-n{font:400 21px/1.25 var(--display);min-width:0}
.dots{flex:1;min-width:12px;border-bottom:1px dotted var(--line-2);align-self:flex-end;margin-bottom:8px}
.mi-p{font:500 16px/1 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.mi-p small{font-weight:400;color:var(--muted);margin-right:5px;font-size:13px}
.mi-d{font-size:15px;color:var(--muted);margin-top:4px;max-width:52ch}
.mi .nadd{width:34px;flex:none}
.allergy{margin-top:30px;font-size:15px;color:var(--ink-2);padding-left:16px;border-left:2px solid var(--blue);max-width:60ch}
.order{position:sticky;top:calc(var(--hdr) + 24px + env(safe-area-inset-top, 0px));min-width:0}
.ocard{background:var(--card);border:1px solid var(--line);padding:26px 24px}
.order .ocard{max-height:calc(100vh - var(--hdr) - 48px);overflow:auto;overscroll-behavior:contain}
.ocard h2{font-size:28px;line-height:1.12;margin-top:12px}
.small{font-size:15px;color:var(--muted);margin-top:10px}
.cart{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.cart li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding-block:11px;border-bottom:1px solid var(--line);font-size:15px}
.qty{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.qty button{width:28px;height:28px;border:1px solid var(--line-2);background:none;border-radius:50%;cursor:pointer;line-height:1;padding:0}
.qty button:hover{border-color:var(--ink)}
.cp{font-variant-numeric:tabular-nums;min-width:54px;text-align:right}
.empty{margin-top:20px;padding:16px;border:1px dashed var(--line-2);font-size:14.5px;color:var(--muted);text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-weight:500}
.total b{font:400 26px/1 var(--display)}
form{display:grid;gap:14px}
.ocard form{margin-top:24px;padding-top:22px;border-top:1px solid var(--ink)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.lbl{display:block;font:500 11.5px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip span{display:block;padding:9px 14px;border:1px solid var(--line-2);font-size:14.5px;line-height:1.2}
.chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{display:block;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-2);background:var(--paper);border-radius:0;font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{color:var(--err);font-size:14.5px}
.res{margin-top:18px;border:1px solid var(--blue);padding:18px;background:var(--blue-soft)}
.res h4{font-size:22px}
.res pre{white-space:pre-wrap;word-break:break-word;font:15px/1.55 var(--sans);margin:10px 0 0;color:var(--ink)}
.res .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cnote{font-size:13.5px;color:var(--muted);margin-top:12px}
@media (max-width:1020px){ .menu-grid{grid-template-columns:1fr} .order{position:static} .order .ocard{max-height:none;overflow:visible} }
@media (max-width:560px){
  .feat{grid-template-columns:1fr;gap:14px}
  .dish{display:grid;grid-template-columns:108px minmax(0,1fr);column-gap:16px;row-gap:4px;padding:14px 16px 14px 10px}
  .dish .art{grid-row:1 / span 3;padding:0;align-self:center}
  .dish > :not(.art){grid-column:2}
  .dish h3{font-size:22px}
  .dish p{font-size:14px}
  .mgroup h3{font-size:26px}
  .mi-n{font-size:19px}
  .ocard{padding:22px 18px}
}

/* terrace */
.ter-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,5vw,72px);align-items:start}
.ter-grid > *{min-width:0}
.dial{margin:36px 0 0;background:var(--card);border:1px solid var(--line);padding:20px 22px 18px}
.dial .cap{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-2)}
.dial svg{margin-top:12px}
.lg{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.lg span{display:flex;align-items:center;gap:8px}
.lg i{display:inline-block;flex:none}
.lg .l-open{width:20px;border-top:4px solid var(--blue);border-radius:2px}
.lg .l-path{width:20px;border-top:2px dotted var(--ink-2)}
.sunsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));column-gap:16px;margin-top:4px}
.ss{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ss small{font-size:13px;color:var(--muted)}
.ss b{font:400 26px/1 var(--display)}
.ss em{font-size:11.5px;letter-spacing:.06em}
.ev-sun{display:flex;gap:9px;align-items:center;font-size:14.5px;color:var(--ink-2)}
.ev-sun .s{width:10px;height:10px;border-radius:50%;background:var(--sun);border:1px solid var(--ink);flex:none}

/* about */
.ab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,96px);align-items:start}
.ab-grid > *{min-width:0}
.hw{font:400 clamp(76px,11vw,150px)/.9 var(--display);margin-top:22px;letter-spacing:-.01em}
.ipa{display:block;font:300 clamp(18px,1.9vw,23px)/1.2 var(--sans);color:var(--muted);margin-top:18px;letter-spacing:.02em}
.ipa b{font-weight:500;color:var(--ink-2);letter-spacing:.14em;text-transform:uppercase;font-size:.62em;margin-left:12px}
.defs{margin:22px 0 0;padding:0 0 0 1.5em;font:400 clamp(22px,2.2vw,28px)/1.35 var(--display)}
.defs li{padding-left:.3em;margin-top:8px}
.defs li::marker{font:500 15px var(--sans);color:var(--blue)}
.princ{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.princ li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 14px;padding-block:26px;border-bottom:1px solid var(--line)}
.princ .n{font:500 12px/2.2 var(--sans);letter-spacing:.2em;color:var(--blue);grid-row:span 2}
.princ h3{font-size:26px;line-height:1.15}
.princ p{color:var(--ink-2);font-size:16px}

/* visit */
.vi-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(32px,5vw,80px);align-items:start}
.vi-grid > *{min-width:0}
.info{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.info li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding-block:22px;border-bottom:1px solid var(--line)}
.info .k{font:500 11.5px/2.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.info .v{font:400 22px/1.35 var(--display);min-width:0;overflow-wrap:anywhere}
.hrs{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 28px}
.hrs .today{color:var(--blue)}
.info small{display:block;font:400 14.5px/1.4 var(--sans);color:var(--muted);margin-top:8px}
.copy{margin-left:10px;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line-2);background:none;padding:7px 10px;cursor:pointer;vertical-align:middle}
.copy:hover{border-color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
@media (max-width:860px){ .ter-grid,.ab-grid,.vi-grid{grid-template-columns:1fr} .info li{grid-template-columns:1fr;gap:4px} }

/* footer */
.foot{background:var(--foot);color:var(--on-foot);padding-block:64px 40px}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px 48px;align-items:end}
.wm{font:400 clamp(72px,13vw,176px)/.82 var(--display);letter-spacing:.14em}
.foot p{color:var(--on-foot-muted);font-size:14.5px;margin-top:22px}
.fnav{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:14.5px}
.fnav a{text-decoration:none;color:var(--on-foot);border-bottom:1px solid transparent}
.fnav a:hover{border-color:currentColor}
@media (max-width:760px){ .foot-in{grid-template-columns:1fr} }

/* a day at LETO: scroll moves the clock from opening to closing; the plate changes and the shadows follow today's sun */
.day{position:relative;height:330vh}
.day-pin{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top, 0px));height:calc(100vh - var(--hdr));height:calc(100svh - var(--hdr) - env(safe-area-inset-top, 0px));overflow:hidden;display:flex;align-items:center}
.day-in{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"head art" "ruler art";gap:0 clamp(28px,5vw,80px);align-items:center;align-content:center}
.day-head{grid-area:head;min-width:0;align-self:end}
.clock{font:400 clamp(84px,11vw,168px)/.9 var(--display);letter-spacing:-.02em;margin-top:16px;white-space:nowrap}
.clock i{font-style:normal;color:var(--blue)}
.moment{margin-top:26px;transition:opacity .25s ease,transform .25s ease}
.moment.swap{opacity:0;transform:translateY(6px)}
.moment .mk{font:500 12px/1.3 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.moment h3{font-size:clamp(30px,3.2vw,44px);line-height:1.08;margin-top:10px}
.moment p{margin-top:10px;color:var(--ink-2);max-width:44ch;min-height:3.2em}
.moment .row{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;margin-top:18px}
.moment .price{font:400 26px/1 var(--display)}
.ruler{grid-area:ruler;min-width:0;max-width:560px;margin-top:clamp(26px,5vh,56px);align-self:start}
.track{position:relative;height:1px;background:var(--line-2);margin-top:22px}
.track .tk{position:absolute;top:-4px;width:1px;height:9px;background:var(--line-2)}
.track .hl{position:absolute;top:14px;transform:translateX(-50%);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.track .mo{position:absolute;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1.5px solid var(--blue);transform:translateX(-50%);transition:background .2s}
.track .mo.on{background:var(--blue)}
.track .sunk{position:absolute;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--sun);border:1.3px solid var(--ink);transform:translateX(-50%);box-shadow:0 0 0 6px rgba(243,181,43,.18)}
.day-note{position:relative;margin-top:44px;font-size:13.5px;color:var(--muted);min-height:1.5em}
.day-note span{position:absolute;left:0;top:0;transition:opacity .3s}
.day-art{grid-area:art;justify-self:center;margin:0;width:min(100%, calc(100svh - var(--hdr) - 96px), 600px)}
.day-art .ill .tb{fill:var(--card);stroke:var(--line-2);stroke-width:1.35}
.day-art .ill .sh{fill:var(--shade)}
@media (max-width:860px){
  .day{height:300vh}
  .day-pin{align-items:flex-start}
  .day-in{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "art" "ruler";gap:0;padding-top:14px}
  .clock{font-size:clamp(60px,18vw,92px);margin-top:8px}
  .moment{margin-top:10px}
  .moment h3{font-size:26px;margin-top:6px}
  .moment p{font-size:15px;line-height:1.45;min-height:2.9em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .moment .row{margin-top:10px}
  .moment .price{font-size:22px}
  .day-art{width:min(100%, calc(100svh - var(--hdr) - 420px), 460px);margin-top:12px}
  .ruler{margin-top:8px;max-width:none;width:100%}
  .track .hl:nth-of-type(even){display:none}
  .day-note{margin-top:38px;font-size:12.5px}
}
.day.static{height:auto}
.day.static .day-pin{position:relative;top:0;height:auto;padding-block:clamp(72px,9vw,120px)}

/* mobile order bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:14px var(--gut-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gut-l);background:linear-gradient(transparent,var(--paper) 40%)}
.cartbar a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;padding:0 20px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:15px;max-width:520px;margin-inline:auto}
.cartbar b{font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
</style>
</head>

    </div>
    <div class="wrap">

        <li class="status" id="status"><i class="dot"></i><span></span></li>
        <li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li>

    </div>

  <div class="calc" data-calc="a" aria-hidden="true"></div>

  </section>

  <section class="sec" id="menu">

  <section class="sec alt" id="terrace">

      </div>

          <button class="btn wide" type="submit" data-t="ev_send"></button>
        </form>
        <div class="res" id="eRes" hidden></div>
      </div>
    </div>
  </section>

      <div>
        <p class="eb" data-t="ab_eb"></p>
        <p class="hw" lang="ru">ле́то</p>

      </div>

/* calçada portuguesa: black basalt waves on white limestone */
let calcN = 0;
function calcada(el) {
  const id = 'c' + (++calcN), T = 160, H = 52;
  const top = [], bot = [];
  for (let i = 0; i <= 40; i++) { const x = i * T / 40, y = 17 + 12 * Math.sin(2 * Math.PI * x / T); top.push(`${f1(x)} ${f1(y)}`); bot.unshift(`${f1(x)} ${f1(y + 18)}`); }
  el.innerHTML = `<svg aria-hidden="true" preserveAspectRatio="none"><defs>
    <pattern id="${id}l" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="cs-gl" width="8" height="8"/><rect class="cs-l" x=".7" y=".7" width="6.6" height="6.6" rx="1.6"/></pattern>
    <pattern id="${id}d" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="cs-gd" width="8" height="8"/><rect class="cs-d" x=".8" y=".8" width="6.4" height="6.4" rx="1.6"/></pattern>
    <pattern id="${id}w" width="${T}" height="${H}" patternUnits="userSpaceOnUse"><path d="M${top.join('L')}L${bot.join('L')}Z" fill="url(#${id}d)"/></pattern>
  </defs><rect width="100%" height="100%" fill="url(#${id}l)"/><rect width="100%" height="100%" fill="url(#${id}w)"/></svg>`;
}

/* ===== the sun over Cascais, with our opening hours on its path ===== */
function drawDial() {
  const n = Date.now(), d = today(), s = sunDay(d), H = hoursOf(d) || [8, 0, 17, 0];
  const cx = 300, HY = 232, rx = 252, ry = 188;
  const o = at(d, H[0], H[1]), c = at(d, H[2], H[3]);
  const P = ms => { const f = Math.max(0, Math.min(1, (ms - s.rise) / (s.set - s.rise))), a = Math.PI * (1 - f); return [cx + rx * Math.cos(a), HY - ry * Math.sin(a)]; };
  const arc = (a, b) => `M${f1(a[0])} ${f1(a[1])}A${rx} ${ry} 0 0 1 ${f1(b[0])} ${f1(b[1])}`;
  const po = P(o), pc = P(c), up = n > s.rise && n < s.set;
  let svg = `<defs><clipPath id="sky"><rect width="600" height="${HY}"/></clipPath></defs>`;
  svg += `<path class="dp" d="${arc([cx - rx, HY], [cx + rx, HY])}"/><path class="do" d="${arc(po, pc)}"/>`;
  svg += `<circle class="dt" cx="${f1(po[0])}" cy="${f1(po[1])}" r="5"/><circle class="dt" cx="${f1(pc[0])}" cy="${f1(pc[1])}" r="5"/>`;
  for (let j = 0; j < 3; j++) { const y = HY + 20 + j * 16, x0 = 70 + j * 46, x1 = 530 - j * 46; let p = `M${x0} ${y}`; for (let x = x0; x < x1; x += 24) p += ` q6 -4 12 0 t12 0`; svg += `<path class="dw" d="${p}"/>`; }
  let sx, sy;
  if (up) [sx, sy] = P(n); else { sx = n <= s.rise ? cx - rx : cx + rx; sy = HY + 4; }
  let rays = '';
  for (let i = 0; i < 8; i++) { const a = i * 45 * RAD; rays += `<path class="dr" d="M${f1(sx + 22 * Math.cos(a))} ${f1(sy + 22 * Math.sin(a))}L${f1(sx + 30 * Math.cos(a))} ${f1(sy + 30 * Math.sin(a))}"/>`; }
  svg += `<g clip-path="url(#sky)">${up ? rays : ''}<circle class="y" cx="${f1(sx)}" cy="${f1(sy)}" r="16"/></g>`;
  svg += `<line class="k" x1="16" y1="${HY}" x2="584" y2="${HY}"/>`;
  const bx = sx > cx ? 168 : 432;
  svg += `<g transform="translate(${bx} ${HY})"><path class="p" d="M-24-1h48l-8 10h-32z"/><path class="p" d="M1-5V-50L24-7z"/><path class="p" d="M-3-9V-42L-20-9z"/></g>`;
  $('#dial').innerHTML = svg;
  const e = Math.round(s.elev(n)) + '°';
  let cap;
  if (n < s.rise) cap = fill(t('cap_pre'), { t: hm(n), r: hm(s.rise) });
  else if (n > s.set) cap = fill(t('cap_set'), { t: hm(n), r: hm(sunDay(addDays(d, 1)).rise) });
  else cap = fill(t('cap_day'), { t: hm(n), e, s: hm(s.set) });
  $('#dialCap').innerHTML = `<i class="dot${status().k === 'open' ? ' on' : ''}"></i><span>${esc(cap)}</span>`;
  $('#dialLg').innerHTML = `<span><i class="l-path"></i>${esc(fill(t('lg_sun'), { r: hm(s.rise), s: hm(s.set) }))}</span><span><i class="l-open"></i>${esc(fill(t('lg_open'), { o: hhmm(H[0], H[1]), c: hhmm(H[2], H[3]) }))}</span>`;
}

function slots(day) {
  const H = hoursOf(day); if (!H) return [];
  const out = [], o = H[0] * 60 + H[1] + 15, c = H[2] * 60 + H[3] - 15, isT = sameDay(day, today());
  const p = tzParts(Date.now()), nowM = p.h * 60 + p.mi;
  for (let m = o; m <= c; m += 15) { if (isT && m < nowM + 20) continue; out.push(m); }
  return out;
}
let pickDays = [];
function renderDays() {
  const d0 = today(); pickDays = [];
  for (let i = 0; i < 10 && pickDays.length < 3; i++) { const d = addDays(d0, i); if (slots(d).length) pickDays.push({ d, i }); }
  const cur = ($('#dayChips input:checked') || {}).value;
  $('#dayChips').innerHTML = pickDays.map((x, k) => {
    const lbl = x.i === 0 ? t('d_today') : x.i === 1 ? t('d_tom') : dayName(x.d, { weekday: 'short', day: 'numeric', month: 'short' });

  }).join('');

function renderTimes() {

}
function resultBox(box, msg) {

  const lines = [t('msg_ev'), `${t('msg_date')}: ${dayName(day, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`];
  if (v('guests')) lines.push(`${t('msg_guests')}: ${v('guests')}`);
  lines.push(`${t('msg_type')}: ${t('ev_t')[evType]}`, `${t('msg_sunset')}: ${hm(sunDay(day).set)}`, `${t('msg_name')}: ${v('name')}`, `${t('msg_contact')}: ${v('contact')}`);
  resultBox($('#eRes'), lines.join('\n'));
});

/* ===== visit + footer ===== */
function renderVisit() {
  const d = today(), w = dow(d), Hs = SITE.hours;
  const same = Hs.every(h => JSON.stringify(h) === JSON.stringify(Hs[0]));
  let hrs;
  if (same && Hs[0]) hrs = `<div class="hrs"><span class="today">${esc(t('every'))}</span><span class="today">${hhmm(Hs[0][0], Hs[0][1])}–${hhmm(Hs[0][2], Hs[0][3])}</span></div>`;
  else {
    const order = [1, 2, 3, 4, 5, 6, 0];
    hrs = `<div class="hrs">${order.map(i => { const dd = addDays(d, (i - w + 7) % 7), h = Hs[i], cls = i === w ? ' class="today"' : ''; const nmD = dayName(dd, { weekday: 'long' }); return `<span${cls}>${esc(nmD.charAt(0).toUpperCase() + nmD.slice(1))}</span><span${cls}>${h ? `${hhmm(h[0], h[1])}–${hhmm(h[2], h[3])}` : esc(t('closed'))}</span>`; }).join('')}</div>`;
  }
  $('#info').innerHTML = `<li><span class="k">${esc(t('k_addr'))}</span><span class="v">${esc(SITE.address)}</span></li>
    <li><span class="k">${esc(t('k_hours'))}</span><span class="v">${hrs}<small>${esc(statusText())}</small></span></li>
    <li><span class="k">${esc(t('k_phone'))}</span><span class="v"><span id="phoneTxt">${esc(SITE.phone)}</span><button type="button" class="copy" id="copyPhone">${esc(t('copy'))}</button></span></li>`;
  $('#copyPhone').onclick = () => {
    const b = $('#copyPhone');
    const ok = () => { b.textContent = t('copied'); setTimeout(() => { b.textContent = t('copy'); }, 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('#phoneTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(SITE.phone).then(ok, sel); } catch (e) { sel(); }
  };
  $('#links').innerHTML = `<a class="btn" href="${SITE.mapsUrl}" target="_blank" rel="noopener">${esc(t('maps'))} ↗</a>` + (SITE.instagram ? `<a class="btn line" href="https://www.instagram.com/${encodeURIComponent(SITE.instagram)}/" target="_blank" rel="noopener">@${esc(SITE.instagram)} ↗</a>` : '');
  $('#fnav').innerHTML = `<a href="#menu">${esc(t('nav_menu'))}</a><a href="#order">${esc(t('nav_order'))}</a><a href="#terrace">${esc(t('nav_terrace'))}</a><a href="#visit">${esc(t('nav_visit'))}</a><a href="${SITE.studio}" target="_blank" rel="noopener">${esc(t('foot_by'))} ↗</a>`;
}

/* ===== i18n & boot ===== */
/* ===== a day at LETO: the clock runs with the scroll, shadows follow today's sun over Cascais ===== */
const DAY = [{ h: 8, id: 'cap_s', art: 'cappuccino', k: 'dm1' }, { h: 10, id: 'breakfast', art: 'breakfast', k: 'dm2' }, { h: 12.5, id: 'shakshuka', art: 'shakshuka', k: 'dm3' }, { h: 16, id: 'syrniki', art: 'syrniki', k: 'dm4' }];
const dayRM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PC = [260, 270], PR = 161;                       // plate centre and radius on the 520 table
let daySeg = -1, dayP = -1, dayRaf = 0, daySun = null;
const dayEase = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const dayClamp = v => Math.max(0, Math.min(1, v));
function dayRange() { const H = hoursOf(today()) || [8, 0, 17, 0]; return [H[0] + H[1] / 60, H[2] + H[3] / 60]; }
function dayBuild() {
  const art = $('#dayArt');
  let s = `<defs><filter id="dSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="dLightG" gradientUnits="userSpaceOnUse" cx="260" cy="260" r="430"><stop offset="0" style="stop-color:var(--sun);stop-opacity:.42"/><stop offset=".55" style="stop-color:var(--sun);stop-opacity:.08"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>
    <clipPath id="dClip"><circle cx="260" cy="260" r="250"/></clipPath></defs>`;
  s += `<circle class="tb" cx="260" cy="260" r="250"/>`;
  s += `<circle id="dLight" cx="260" cy="260" r="250" fill="url(#dLightG)"/>`;
  // shadows sit on the table, under everything
  s += `<g clip-path="url(#dClip)"><g filter="url(#dSoft)">`;
  s += `<circle class="sh" data-sh="glass" data-h="70" cx="372" cy="86" r="30"/>`;
  s += `<g class="sh" data-sh="glasses" data-h="16"><circle cx="0" cy="0" r="23"/><circle cx="54" cy="0" r="23"/></g>`;
  DAY.forEach((m, i) => { s += `<circle class="sh" data-sh="p${i}" data-h="14" cx="${PC[0]}" cy="${PC[1]}" r="${PR}"/>`; });
  s += `</g></g>`;
  // a glass of water, top right
  s += `<circle class="p" cx="372" cy="86" r="30"/><circle class="k" cx="372" cy="86" r="24"/><path class="k" d="M356 76q6-9 16-11"/>`;
  // sunglasses folded on the table, lower left
  s += `<g id="dGlasses" transform="translate(126 420) rotate(30)"><path class="k" d="M-22-15L62-27M76-15L-8-27"/><circle class="i" cx="0" cy="0" r="23"/><circle class="i" cx="54" cy="0" r="23"/><path class="k" d="M21-6Q27-13 33-6"/><path class="gl" d="M-13-9q4-8 12-10M41-9q4-8 12-10"/></g>`;
  // one plate per moment of the day
  DAY.forEach((m, i) => { s += `<g class="dplate" data-i="${i}" opacity="${i ? 0 : 1}"><g transform="translate(${PC[0] - 100 * PR / 92} ${PC[1] - 100 * PR / 92}) scale(${(PR / 92).toFixed(3)})">${ART[m.art]()}</g></g>`; });
  art.innerHTML = s;
  art.setAttribute('aria-label', t('day_art'));
  // ruler: an hour tick each hour, a dot for each moment, and the sun
  const [h0, h1] = dayRange(), X = h => ((h - h0) / (h1 - h0) * 100).toFixed(2) + '%';
  let r = '';
  for (let h = Math.ceil(h0); h <= h1; h++) r += `<i class="tk" style="left:${X(h)}"></i><span class="hl" style="left:${X(h)}">${h}h</span>`;
  DAY.forEach((m, i) => { r += `<i class="mo" data-i="${i}" style="left:${X(m.h)}"></i>`; });
  r += `<i class="sunk" id="daySunk"></i>`;
  $('#dayTrack').innerHTML = r;
  const sd = sunDay(today());
  daySun = sd;
  $('#dayNote').textContent = fill(t('day_note'), { r: hm(sd.rise), s: hm(sd.set) });
  daySeg = -1; dayP = -1;
  dayUpdate(true);
}
function dayMoment(i) {
  const m = DAY[i], el = $('#dayMoment'), it = item(m.id);
  const fillIt = () => {
    $('#dayMk').textContent = t(m.k);
    $('#dayName').textContent = nm(m.id);
    $('#dayDesc').textContent = I18N[lang]['m_' + m.id + '_f'] || t('m_' + m.id + '_d');
    $('#dayPrice').textContent = eur(it.price);
    dayBtn();
  };
  if (daySeg === -1 || dayRM) { fillIt(); return; }
  el.classList.add('swap');
  clearTimeout(el._t); el._t = setTimeout(() => { fillIt(); el.classList.remove('swap'); }, 180);
}
function dayBtn() {
  const i = Math.max(0, daySeg), id = DAY[i].id, n = cart.get(id) || 0, b = $('#dayAdd');
  if (!b) return;
  b.textContent = n ? fill(t('day_in'), { n }) : t('day_add');
}
function dayTime(p) {
  const [h0, h1] = dayRange(), n = DAY.length, seg = Math.min(n - 1, Math.floor(p * n)), u = p * n - seg;
  const from = Math.max(h0, DAY[seg].h), to = seg < n - 1 ? DAY[seg + 1].h : h1;
  return { seg, u: Math.min(1, u), h: from + (to - from) * Math.min(1, u) };
}
function dayUpdate(force) {
  const sec = $('#day');
  let p;
  if (dayRM) {
    sec.classList.add('static');
    const tp = tzParts(Date.now()), [h0, h1] = dayRange(), now = tp.h + tp.mi / 60;
    let seg = 0; DAY.forEach((m, i) => { if (now >= m.h) seg = i; });
    p = now >= h0 && now < h1 ? (seg + .5) / DAY.length : .5 / DAY.length;
  } else {
    const hd = $('.hdr').offsetHeight, span = sec.offsetHeight - (innerHeight - hd);
    p = span > 0 ? dayClamp((hd - sec.getBoundingClientRect().top) / span) : 0;
  }
  if (!force && Math.abs(p - dayP) < .0005) return;
  dayP = p;
  const { seg, u, h } = dayTime(p);
  if (seg !== daySeg) { dayMoment(seg); daySeg = seg; }
  // clock, rounded to five minutes
  const mins = Math.round(h * 12) * 5, hh = Math.floor(mins / 60), mm = mins % 60;
  $('#dayClock').innerHTML = `${pad(hh)}<i>:</i>${pad(mm)}`;
  // the sun on the ruler
  const [h0, h1] = dayRange();
  $('#daySunk').style.left = ((h - h0) / (h1 - h0) * 100).toFixed(2) + '%';
  $$('#dayTrack .mo').forEach(m => m.classList.toggle('on', +m.dataset.i <= seg));
  $('#dayCue').style.opacity = dayRM ? 0 : (1 - dayClamp(p / .03)).toFixed(2);
  $('#dayNote').style.opacity = dayRM ? 1 : dayClamp((p - .02) / .03).toFixed(2);
  // plates: the previous one lifts away, the next is set down
  const lift = [];
  $$('#dayArt .dplate').forEach(g => {
    const i = +g.dataset.i;
    let o = 0, sc = 1, rot = 0, up = 0;
    if (i === seg) {
      const a = seg === 0 ? 1 : dayEase(dayClamp((u - .1) / .14));
      o = a; sc = 1.1 - .1 * a; rot = -12 * (1 - a); up = 1 - a;
    } else if (i === seg - 1) {
      const a = dayEase(dayClamp(u / .12));
      o = 1 - a; sc = 1 + .1 * a; rot = 9 * a; up = a;
    }
    g.setAttribute('opacity', o.toFixed(3));
    g.setAttribute('transform', o ? `translate(${PC[0]} ${PC[1]}) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(4)}) translate(${-PC[0]} ${-PC[1]})` : 'translate(9999 0)');
    lift[i] = { o, up, sc };
  });
  // today's sun at this hour
  const ms = at(today(), Math.floor(h), Math.round((h % 1) * 60) % 60), sd = daySun || sunDay(today());
  const el = sd.elev(ms), az = sd.azim(ms), up = el > 0;
  const len = hgt => up ? Math.min(hgt * 3.4, hgt / Math.tan(Math.max(el, 4) * RAD)) : 0;
  const dx = -Math.sin(az * RAD), dy = Math.cos(az * RAD);
  $$('#dayArt .sh').forEach(sh => {
    const k = sh.dataset.sh, hgt = +sh.dataset.h;
    if (k[0] === 'p') {
      const L = lift[+k.slice(1)] || { o: 0, up: 0, sc: 1 }, d = len(hgt + 60 * L.up);
      sh.setAttribute('cx', (PC[0] + dx * d).toFixed(1)); sh.setAttribute('cy', (PC[1] + dy * d).toFixed(1));
      sh.setAttribute('r', (PR * L.sc).toFixed(1));
      sh.setAttribute('opacity', (L.o * (up ? 1 : .35)).toFixed(3));
    } else if (k === 'glass') {
      const d = len(hgt); sh.setAttribute('cx', (372 + dx * d).toFixed(1)); sh.setAttribute('cy', (86 + dy * d).toFixed(1)); sh.setAttribute('opacity', up ? 1 : .35);
    } else {
      const d = len(hgt); sh.setAttribute('transform', `translate(${(126 + dx * d).toFixed(1)} ${(420 + dy * d).toFixed(1)}) rotate(30)`); sh.setAttribute('opacity', up ? 1 : .35);
    }
  });
  // sunlight comes from the sun's side, warmer when it is low
  const li = $('#dLight'), g = $('#dLightG');
  g.setAttribute('cx', (260 - dx * 330).toFixed(1)); g.setAttribute('cy', (260 - dy * 330).toFixed(1));
  li.setAttribute('opacity', up ? (.55 + .45 * (1 - Math.min(1, el / 45))).toFixed(3) : 0);
}
addEventListener('scroll', () => { if (!dayRaf) dayRaf = requestAnimationFrame(() => { dayRaf = 0; dayUpdate(false); }); }, { passive: true });
addEventListener('resize', () => dayUpdate(true));

function applyTexts() {
  document.documentElement.lang = lang;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#heroTitle').innerHTML = t('hero_h');
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function tick() { renderStatus(); renderLive(); drawDial(); }
function renderAll() {
  applyTexts(); heroArt(); tick(); renderMenu(); renderCart(); dayBuild(); renderDays(); renderSunsets(); renderEvTypes(); evSunset(); renderVisit();
  $('#oRes').hidden = true; $('#eRes').hidden = true;
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('leto-lang', lang); } catch (e) {}
  renderAll();
}));
$$('[data-calc]').forEach(calcada);
$('#dayAdd').addEventListener('click', () => addItem(DAY[Math.max(0, daySeg)].id, 1));
$('#eDate').min = isoDay(today());
renderAll();
setInterval(() => { tick(); renderVisit(); renderDays(); }, 30000);
</script>
