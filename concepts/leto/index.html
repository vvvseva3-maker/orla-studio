<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LETO Café Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#fffdf6; --bg-2:#fff4d2; --card:#ffffff; --ink:#10263a; --ink-2:#34485a; --muted:#5d6b77; --line:#ebe0c3;
  --sun:#ffcc33; --sun-deep:#f5b400; --sun-ink:#8a5a00; --on-sun:#10263a; --sun-soft:rgba(255,204,51,.28);
  --sea:#0b5c8c; --sea-2:#084468; --on-sea:#f3f8fb; --on-sea-muted:#b9d1e2; --sea-line:rgba(243,248,251,.24);
  --tomato:#d23c1d; --leaf:#24804a; --ic-sea:#0b5c8c;
  --stripe:#0b5c8c; --stripe-2:#fffdf6;
  --foot:#10263a; --on-foot:#f5efe2; --on-foot-muted:#a9b6c1;
  --shadow:0 1px 0 rgba(16,38,58,.05), 0 18px 40px -18px rgba(16,38,58,.28);
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --hdr:66px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1621; --bg-2:#111f2c; --card:#152637; --ink:#f5efe2; --ink-2:#d2d9df; --muted:#97a5b1; --line:#26394c;
  --sun:#ffcc33; --sun-deep:#ffd659; --sun-ink:#ffd25e; --on-sun:#10263a; --sun-soft:rgba(255,204,51,.16);
  --sea:#0d3d5e; --sea-2:#082a42; --on-sea:#eef5fa; --on-sea-muted:#a3bed2; --sea-line:rgba(238,245,250,.18);
  --tomato:#ff6a4a; --leaf:#5cc485; --ic-sea:#7ab8e2;
  --stripe:#0f4f7b; --stripe-2:#e6edf1;
  --foot:#060e16; --on-foot:#e9e4d8; --on-foot-muted:#8d9aa6;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 18px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1621; --bg-2:#111f2c; --card:#152637; --ink:#f5efe2; --ink-2:#d2d9df; --muted:#97a5b1; --line:#26394c;
  --sun:#ffcc33; --sun-deep:#ffd659; --sun-ink:#ffd25e; --on-sun:#10263a; --sun-soft:rgba(255,204,51,.16);
  --sea:#0d3d5e; --sea-2:#082a42; --on-sea:#eef5fa; --on-sea-muted:#a3bed2; --sea-line:rgba(238,245,250,.18);
  --tomato:#ff6a4a; --leaf:#5cc485; --ic-sea:#7ab8e2;
  --stripe:#0f4f7b; --stripe-2:#e6edf1;
  --foot:#060e16; --on-foot:#e9e4d8; --on-foot-muted:#8d9aa6;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 18px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 12px + env(safe-area-inset-top, 0px))}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.wrap{max-width:1200px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.eb{font:800 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--sun-ink)}
.h2{font-size:clamp(27px,3.7vw,44px);line-height:1.1;margin-top:14px}
.lead{color:var(--ink-2);font-size:17px;max-width:58ch;margin-top:16px}
.sec{padding-block:clamp(64px,9vw,104px)}
.sun-dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--sun);flex:none}

/* concept ribbon */
.rib{background:var(--foot);color:var(--on-foot);font-size:12.5px;line-height:1.45}
.rib .wrap{padding-block:8px;display:flex;gap:10px;align-items:center;justify-content:center;text-align:center}
.rib b{background:var(--sun);color:var(--on-sun);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:14px;height:var(--hdr)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font:800 23px/1 var(--display);letter-spacing:.03em}
.logo i{width:15px;height:15px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{text-decoration:none;font-weight:600;font-size:15px;color:var(--ink-2)}
.nav a:hover{color:var(--ink)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:700 12px/1 var(--sans);letter-spacing:.06em;padding:8px 9px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font:700 15px/1.1 var(--sans);text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .15s ease, background .15s ease}
.btn:active{transform:translateY(1px)}
.btn.sun{background:var(--sun);color:var(--on-sun);border-color:var(--sun)}
.btn.sun:hover{background:var(--sun-deep);border-color:var(--sun-deep)}
.btn.line{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.line:hover{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.hdr .btn{margin-left:0}
@media (max-width:900px){ .nav{display:none} .lang{margin-left:auto} }
@media (max-width:380px){ .hdr .btn{padding:0 12px} .logo{font-size:20px} }

/* awning */
.awning{height:30px;background:repeating-linear-gradient(90deg,var(--stripe) 0 28px,var(--stripe-2) 28px 56px);
  -webkit-mask:radial-gradient(circle 14px at 14px 16px,#000 13.4px,transparent 14px) 0 0/28px 30px repeat-x,linear-gradient(#000,#000) 0 0/100% 16px no-repeat;
          mask:radial-gradient(circle 14px at 14px 16px,#000 13.4px,transparent 14px) 0 0/28px 30px repeat-x,linear-gradient(#000,#000) 0 0/100% 16px no-repeat}
.awning.alt{--stripe:var(--sun);--stripe-2:var(--bg)}

/* hero */
.hero{background:var(--bg)}
.hero-in{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(28px,5vw,64px);align-items:center;padding-block:clamp(28px,4vw,48px) clamp(56px,7vw,88px)}
.hero-copy{min-width:0}
.status{display:inline-flex;align-items:center;gap:9px;font:700 13px/1.2 var(--sans);padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.open i{background:var(--leaf);box-shadow:0 0 0 0 var(--leaf);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(36,128,74,.45)}70%{box-shadow:0 0 0 9px rgba(36,128,74,0)}100%{box-shadow:0 0 0 0 rgba(36,128,74,0)}}
.hero h1{font-size:clamp(31px,4.7vw,60px);line-height:1.06;margin:22px 0 0;font-weight:800}
.hero h1 em{font-style:normal;background:var(--sun);color:var(--on-sun);padding:0 .14em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero .lead{font-size:18px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{list-style:none;padding:0;margin:30px 0 0;display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:600;font-size:14px;color:var(--ink-2)}
.facts li{display:flex;align-items:center;gap:8px}
.facts li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.scene{margin:0;position:relative;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);background:var(--sea);max-width:100%}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);color:var(--ink);border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.4;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.scene figcaption .sun-dot{margin-top:.28em}
@media (max-width:860px){ .hero-in{grid-template-columns:1fr} .scene{order:2} }

/* marquee */
.mq{background:var(--sun);color:var(--on-sun);overflow:hidden;border-block:2px solid var(--on-sun)}
.track{display:flex;width:max-content;animation:mq 46s linear infinite}
.track span{display:flex;align-items:center;gap:22px;padding:15px 11px;font:700 18px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.track svg{width:20px;height:20px;flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){ .track{animation:none} }

/* menu */
.menu-head{display:grid;grid-template-columns:1fr minmax(0,440px);gap:32px;align-items:end}
.allday{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px 16px}
.ad-bar{position:relative;height:14px;border-radius:999px;background:var(--bg-2);margin-top:30px}
.ad-fill{position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--sun-deep))}
.ad-now{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink);border:4px solid var(--card);transition:left .4s}
.ad-now b{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:700 12px/1 var(--sans);background:var(--ink);color:var(--bg);padding:5px 7px;border-radius:7px;white-space:nowrap}
.ad-scale{display:flex;justify-content:space-between;font:600 12px/1 var(--sans);color:var(--muted);margin-top:9px}
#adNote{margin-top:12px;font-size:14.5px;color:var(--ink-2)}
@media (max-width:860px){ .menu-head{grid-template-columns:1fr} }

.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:44px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dish .art{background:var(--bg-2);border-radius:20px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;padding:8%}
.dish .art svg{width:100%;height:auto;display:block}
.dish h3{font-size:17px;line-height:1.2;font-weight:700}
.dish p{font-size:13.5px;color:var(--muted);line-height:1.45;flex:1}
.dish .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font:700 17px/1 var(--display);letter-spacing:0}
.add{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;position:relative;transition:background .15s}
.add svg{width:16px;height:16px}
.add:hover{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.add[data-n]:not([data-n="0"]){background:var(--ink);color:var(--bg)}
.add[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:999px;background:var(--sun);color:var(--on-sun);font:800 11px/20px var(--sans);text-align:center;padding:0 5px}
.add.sm{width:34px;height:34px}
.add.sm svg{width:13px;height:13px}
@media (max-width:980px){ .feat{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:420px){ .feat{gap:12px} .dish{padding:10px 10px 12px;border-radius:20px} .dish p{display:none} .price{font-size:15px} }

.mlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 40px;margin-top:56px}
.mgroup h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.mgroup ul{list-style:none;margin:0;padding:0}
.mi{padding:13px 0;border-bottom:1px solid var(--line)}
.mi-top{display:flex;align-items:center;gap:10px}
.mi-n{font-weight:700;font-size:16px;min-width:0}
.dots{flex:1;min-width:14px;border-bottom:2px dotted var(--line);transform:translateY(5px)}
.mi-p{font-weight:800;font-size:15.5px;white-space:nowrap}
.mi-p small{font-weight:600;color:var(--muted);font-size:12px;margin-right:3px}
.mi-d{font-size:13.5px;color:var(--muted);margin-top:3px;padding-right:44px}
.note{margin-top:40px;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--leaf);border-radius:16px;padding:16px 18px;font-size:15px;color:var(--ink-2);max-width:760px}
.note svg{width:22px;height:22px;flex:none;color:var(--leaf);margin-top:1px}
@media (max-width:860px){ .mlist{grid-template-columns:1fr;gap:36px} }

/* order */
.order{background:var(--bg-2)}
.order-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;margin-top:40px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,28px);min-width:0}
.panel h3{font-size:18px}
.cart{list-style:none;margin:16px 0 0;padding:0}
.cart li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cart .cn{font-weight:700;font-size:15px;line-height:1.3}
.cart .cp{font-weight:800;font-size:15px;min-width:58px;text-align:right}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:34px;height:34px;border:0;background:none;cursor:pointer;font:700 17px/1 var(--sans);border-radius:50%}
.qty button:hover{background:var(--bg-2)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-size:14px}
.cart-empty{margin-top:16px;color:var(--muted);font-size:15px;border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-weight:800}
.total b{font:700 24px/1 var(--display)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font:700 12.5px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;font:500 16px/1.4 var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:50px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--sun-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:0 15px;border:1.5px solid var(--line);border-radius:999px;font-weight:700;font-size:14px;background:var(--bg)}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:focus-visible+span{box-shadow:0 0 0 4px var(--sun-soft)}
.err{color:var(--tomato);font-weight:700;font-size:14px;margin-top:12px}
.submit{margin-top:18px;width:100%}
.result{margin-top:18px;border:2px solid var(--ink);border-radius:20px;padding:18px;background:var(--bg)}
.result h4{margin:0;font:700 16px/1.2 var(--display)}
.result pre{white-space:pre-wrap;word-break:break-word;font:500 14px/1.55 var(--sans);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.result .acts{display:flex;flex-wrap:wrap;gap:10px}
.result .cnote{font-size:13.5px;color:var(--muted);margin-top:12px}
@media (max-width:900px){ .order-grid{grid-template-columns:1fr} }
@media (max-width:460px){ .fgrid{grid-template-columns:1fr} }

/* terrace */
.terrace{background:var(--sea);color:var(--on-sea)}
.terrace .eb{color:var(--sun)}
.terrace .lead{color:var(--on-sea-muted)}
.ter-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:clamp(28px,5vw,64px);align-items:start;padding-block:clamp(48px,7vw,84px) clamp(64px,9vw,104px)}
.sunsets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:34px}
.ss{border:1px solid var(--sea-line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ss small{font-weight:700;font-size:12.5px;color:var(--on-sea-muted);text-transform:capitalize}
.ss b{font:700 24px/1 var(--display);display:flex;align-items:center;gap:9px}
.ss b::before{content:"";width:18px;height:9px;border-radius:10px 10px 0 0;background:var(--sun);box-shadow:0 3px 0 -1px var(--on-sea-muted);margin-top:-6px}
.ss em{font-style:normal;align-self:flex-start;background:var(--sun);color:var(--on-sun);font-weight:800;font-size:11px;letter-spacing:.04em;padding:3px 7px;border-radius:6px}
.ter-grid .panel{color:var(--ink)}
.evsun{font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:center;min-height:20px}
@media (max-width:900px){ .ter-grid{grid-template-columns:1fr} }
@media (max-width:520px){ .sunsets{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:center}
.dict{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding-block:28px}
.dict .w{font:800 clamp(64px,11vw,128px)/.9 var(--display);letter-spacing:-.03em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dict .w i{font:500 16px/1 var(--sans);font-style:normal;color:var(--muted);letter-spacing:0}
.dict .pos{margin-top:14px;font-style:italic;color:var(--muted);font-size:15px}
.dict ol{margin:14px 0 0;padding-left:24px;font-size:19px;font-weight:600;line-height:1.45}
.dict ol li::marker{font-family:var(--display);font-weight:700;color:var(--sun-ink)}
.points{display:grid;gap:14px}
.pt{display:grid;grid-template-columns:54px minmax(0,1fr);gap:16px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.pt .ic{width:54px;height:54px;border-radius:16px;background:var(--bg-2);display:grid;place-items:center}
.pt .ic svg{width:28px;height:28px}
.pt h3{font-size:17px}
.pt p{font-size:15px;color:var(--ink-2);margin-top:5px}
@media (max-width:860px){ .about-grid{grid-template-columns:1fr} }

/* visit */
.visit{background:var(--bg-2)}
.visit-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;margin-top:40px}
.info{list-style:none;margin:0;padding:0}
.info li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.info li:last-child{border-bottom:0}
.info .k{font:700 12.5px/1.5 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info .v{font-weight:600;font-size:16px}
.info .v small{display:block;color:var(--muted);font-weight:500;font-size:13.5px}
.hrs{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 18px}
.hrs .today{font-weight:800}
.copy{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;font:700 12.5px/1 var(--sans);padding:7px 11px;cursor:pointer;margin-left:8px;vertical-align:middle}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.big{background:var(--sun);color:var(--on-sun);border-radius:26px;padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:280px;position:relative;overflow:hidden}
.big h3{font-size:clamp(24px,2.8vw,32px);line-height:1.1;max-width:14ch;position:relative}
.big p{font-weight:600;max-width:34ch;position:relative}
.big .btn{align-self:flex-start;background:var(--on-sun);color:var(--sun);border-color:var(--on-sun);position:relative}
.big>*{z-index:1}
.big::after{content:"";position:absolute;right:-90px;bottom:-110px;width:260px;height:260px;border-radius:50%;border:28px solid rgba(255,255,255,.42);z-index:0}
@media (max-width:860px){ .visit-grid{grid-template-columns:1fr} .info li{grid-template-columns:1fr;gap:4px} }

/* footer */
.foot{background:var(--foot);color:var(--on-foot);padding-block:48px calc(48px + env(safe-area-inset-bottom, 0px))}
.foot-in{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:flex-end;justify-content:space-between}
.foot .logo{font-size:44px}
.foot p{color:var(--on-foot-muted);font-size:14px;margin-top:10px;max-width:46ch}
.foot nav{display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:600;font-size:14px}
.foot nav a{text-decoration:none;color:var(--on-foot)}
.foot nav a:hover{text-decoration:underline}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gut-l);pointer-events:none}
.cartbar a{pointer-events:auto;max-width:520px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:999px;padding:10px 10px 10px 22px;font-weight:700;box-shadow:var(--shadow)}
.cartbar a span:last-child{background:var(--sun);color:var(--on-sun);border-radius:999px;padding:10px 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--sun-deep);outline-offset:2px}
</style>
</head>
<body>
<div class="rib"><div class="wrap"><b data-t="rib_tag"></b><span data-t="rib"></span></div></div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="#top" aria-label="LETO"><span>LETO</span><i></i></a>
    <nav class="nav" aria-label="Menu">
      <a href="#menu" data-t="nav_menu"></a>
      <a href="#order" data-t="nav_order"></a>
      <a href="#terrace" data-t="nav_terrace"></a>
      <a href="#visit" data-t="nav_visit"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
    </div>
    <a class="btn sun sm" href="#order" data-t="hdr_cta"></a>
  </div>
</header>

<main>
<section class="hero" id="top">
  <div class="awning" aria-hidden="true"></div>
  <div class="wrap hero-in">
    <div class="hero-copy">
      <p class="status" id="status" aria-live="polite"><i></i><span></span></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" data-t="hero_lede"></p>
      <div class="ctas">
        <a class="btn sun" href="#menu" data-t="cta_menu"></a>
        <a class="btn line" href="#order" data-t="cta_order"></a>
      </div>
      <ul class="facts"><li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li></ul>
    </div>
    <figure class="scene">
      <svg id="scene" viewBox="0 0 600 460" role="img" aria-labelledby="sceneCap"></svg>
      <figcaption><span class="sun-dot"></span><span id="sceneCap"></span></figcaption>
    </figure>
  </div>
</section>

<div class="mq" aria-hidden="true"><div class="track" id="track"></div></div>

<section class="sec" id="menu">
  <div class="wrap">
    <div class="menu-head">
      <div>
        <p class="eb" data-t="menu_eb"></p>
        <h2 class="h2" data-t="menu_h"></h2>
        <p class="lead" id="menuLead"></p>
      </div>
      <div class="allday" aria-live="polite">
        <div class="ad-bar"><span class="ad-fill"></span><span class="ad-now" id="adNow"><b id="adNowT"></b></span></div>
        <div class="ad-scale" id="adScale"></div>
        <p id="adNote"></p>
      </div>
    </div>
    <div class="feat" id="feat"></div>
    <div class="mlist" id="mlist"></div>
    <p class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19c3-4 6-6 10-8"/></svg><span data-t="allergy"></span></p>
  </div>
</section>

<section class="sec order" id="order">
  <div class="wrap">
    <p class="eb" data-t="order_eb"></p>
    <h2 class="h2" data-t="order_h"></h2>
    <p class="lead" data-t="order_p"></p>
    <div class="order-grid">
      <div class="panel">
        <h3 data-t="cart_h"></h3>
        <ul class="cart" id="cart"></ul>
        <p class="cart-empty" id="cartEmpty" data-t="cart_empty"></p>
        <div class="total" id="totalRow" hidden><span data-t="cart_total"></span><b id="total"></b></div>
      </div>
      <form class="panel" id="orderForm" novalidate>
        <h3 data-t="pick_h"></h3>
        <div class="fgrid">
          <div class="f full"><span class="lbl" data-t="f_day"></span><div class="chips" id="dayChips" role="radiogroup"></div></div>
          <div class="f full"><label for="oTime" data-t="f_time"></label><select id="oTime" name="time"></select></div>
          <div class="f"><label for="oName" data-t="f_name"></label><input id="oName" name="name" autocomplete="name"></div>
          <div class="f"><label for="oPhone" data-t="f_phone"></label><input id="oPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
          <div class="f full"><label for="oNote" data-t="f_note"></label><textarea id="oNote" name="note"></textarea></div>
        </div>
        <p class="err" id="oErr" hidden></p>
        <button class="btn sun submit" type="submit" data-t="f_send"></button>
        <div class="result" id="oRes" hidden></div>
      </form>
    </div>
  </div>
</section>

<section class="terrace" id="terrace">
  <div class="awning alt" aria-hidden="true"></div>
  <div class="wrap ter-grid">
    <div>
      <p class="eb" data-t="ter_eb"></p>
      <h2 class="h2" data-t="ter_h"></h2>
      <p class="lead" data-t="ter_p"></p>
      <div class="sunsets" id="sunsets"></div>
    </div>
    <form class="panel" id="evForm" novalidate>
      <h3 data-t="ev_h"></h3>
      <div class="fgrid">
        <div class="f"><label for="eDate" data-t="ev_date"></label><input id="eDate" name="date" type="date"></div>
        <div class="f"><label for="eGuests" data-t="ev_guests"></label><input id="eGuests" name="guests" type="number" min="2" max="80" inputmode="numeric"></div>
        <div class="f full"><p class="evsun" id="evSun"></p></div>
        <div class="f full"><span class="lbl" data-t="ev_type"></span><div class="chips" id="evTypes" role="radiogroup"></div></div>
        <div class="f"><label for="eName" data-t="f_name"></label><input id="eName" name="name" autocomplete="name"></div>
        <div class="f"><label for="eContact" data-t="ev_contact"></label><input id="eContact" name="contact" autocomplete="tel"></div>
      </div>
      <p class="err" id="eErr" hidden></p>
      <button class="btn sun submit" type="submit" data-t="ev_send"></button>
      <div class="result" id="eRes" hidden></div>
    </form>
  </div>
</section>

<section class="sec" id="about">
  <div class="wrap about-grid">
    <div>
      <p class="eb" data-t="ab_eb"></p>
      <div class="dict" style="margin-top:22px">
        <div class="w">лето <i>[ˈlʲetə]</i></div>
        <p class="pos" data-t="ab_pos"></p>
        <ol><li data-t="ab_d1"></li><li data-t="ab_d2"></li></ol>
      </div>
    </div>
    <div class="points">
      <div class="pt"><div class="ic" id="ic1"></div><div><h3 data-t="ab1_h"></h3><p data-t="ab1_p"></p></div></div>
      <div class="pt"><div class="ic" id="ic2"></div><div><h3 data-t="ab2_h"></h3><p data-t="ab2_p"></p></div></div>
      <div class="pt"><div class="ic" id="ic3"></div><div><h3 data-t="ab3_h"></h3><p data-t="ab3_p"></p></div></div>
    </div>
  </div>
</section>

<section class="sec visit" id="visit">
  <div class="wrap">
    <p class="eb" data-t="vi_eb"></p>
    <h2 class="h2" data-t="vi_h"></h2>
    <div class="visit-grid">
      <div class="panel">
        <ul class="info" id="info"></ul>
        <div class="links" id="links"></div>
      </div>
      <div class="big">
        <h3 data-t="big_h"></h3>
        <p data-t="big_p"></p>
        <a class="btn" href="#order" data-t="cta_order"></a>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <a class="logo" href="#top"><span>LETO</span><i></i></a>
      <p data-t="foot_p"></p>
    </div>
    <nav id="fnav" aria-label="Footer"></nav>
  </div>
</footer>

<div class="cartbar" id="cartBar" hidden><a href="#order"><span id="cbText"></span><span data-t="cb_go"></span></a></div>

const egg = (x, y, s) => { s = s || 1; return `<path transform="translate(${x} ${y}) scale(${s})" d="M-21 0c0-14 11-21 22-20c12 1 21 8 20 19c-1 12-10 19-22 18c-12 0-20-6-20-17z" fill="#fffaf0" stroke="#efe6d2" stroke-width="1"/><circle cx="${x + s}" cy="${y}" r="${8.5 * s}" fill="#ffb21a"/><circle cx="${x - 2 * s}" cy="${y - 3 * s}" r="${2.6 * s}" fill="#ffe08a"/>`; };
const pancake = (x, y) => `<circle cx="${x}" cy="${y + 4}" r="29" fill="#b4672a"/><circle cx="${x}" cy="${y}" r="29" fill="#d98a3c"/><circle cx="${x}" cy="${y}" r="22" fill="#eaa457"/><ellipse cx="${x - 8}" cy="${y - 8}" rx="8" ry="4" fill="#f6c983" transform="rotate(-35 ${x - 8} ${y - 8})"/>`;
const ART = {
  shakshuka: `<rect x="150" y="18" width="18" height="62" rx="9" fill="#2b2826" transform="rotate(42 159 49)"/><circle cx="94" cy="108" r="82" fill="#2b2826"/><circle cx="94" cy="108" r="72" fill="#c43a1e"/><circle cx="64" cy="140" r="17" fill="#d84a2a"/><circle cx="132" cy="136" r="13" fill="#d84a2a"/><circle cx="122" cy="66" r="11" fill="#b2311a"/><circle cx="58" cy="78" r="8" fill="#e05a36"/>${egg(70, 92)}${egg(120, 104)}${egg(88, 140, .95)}${herb(48, 112, 30)}${herb(142, 82, -20)}${herb(110, 140, 60)}${herb(96, 66, 10)}${herb(136, 150, -40)}${herb(56, 140, 80)}${herb(100, 112, -60, '#5aa86b')}`,
  syrniki: `${PLATE}${pancake(72, 82)}${pancake(126, 80)}${pancake(96, 128)}<path d="M128 122c10-8 27-4 29 8c2 12-10 20-23 18c-12-2-14-18-6-26z" fill="#fffdf7" stroke="#e9e0cf" stroke-width="1.5"/><circle cx="56" cy="128" r="6" fill="#b0153d"/><circle cx="64" cy="138" r="5.5" fill="#c21a46"/><circle cx="52" cy="140" r="5" fill="#9d1236"/><circle cx="146" cy="58" r="5" fill="#3b2f6e"/><circle cx="154" cy="66" r="4.5" fill="#4a3a86"/>${herb(150, 112, -30, '#4a9b5e')}${herb(158, 118, 20, '#4a9b5e')}`,
  breakfast: `${PLATE}${egg(70, 76)}${egg(110, 62, .82)}<rect x="96" y="92" width="56" height="15" rx="7.5" fill="#8f4325" transform="rotate(24 124 99)"/><rect x="100" y="94" width="40" height="4" rx="2" fill="#b0603a" transform="rotate(24 124 99)"/><circle cx="146" cy="128" r="16" fill="#c9381f"/><circle cx="146" cy="128" r="11" fill="#e8613f"/><ellipse cx="142" cy="125" rx="2" ry="3.4" fill="#ffd29a"/><ellipse cx="150" cy="131" rx="2" ry="3.4" fill="#ffd29a"/><circle cx="118" cy="148" r="14" fill="#c9381f"/><circle cx="118" cy="148" r="9.5" fill="#e8613f"/><circle cx="70" cy="126" r="21" fill="#7fae48"/><circle cx="66" cy="121" r="11" fill="#9cc865" opacity=".75"/><path d="M78 168 l26 -26 l16 30z" fill="#e7c084"/><path d="M84 164 l18 -18" stroke="#d4a868" stroke-width="2"/>${herb(96, 126, 40)}${herb(52, 98, -30)}${herb(132, 72, 15)}`,
  cappuccino: `<circle cx="100" cy="100" r="90" fill="#fbf8f1"/><circle cx="100" cy="100" r="89" fill="none" stroke="#e3dccb" stroke-width="2"/><rect x="44" y="150" width="62" height="9" rx="4.5" fill="#cfc6b4" transform="rotate(-28 75 154)"/><rect x="146" y="88" width="38" height="24" rx="12" fill="#ffffff" stroke="#e3dccb" stroke-width="2"/><circle cx="100" cy="100" r="58" fill="#ffffff" stroke="#e3dccb" stroke-width="2"/><circle cx="100" cy="100" r="48" fill="#a8652f"/><circle cx="100" cy="100" r="41" fill="#f1dfc2"/><path d="M100 122c-18-12-26-20-26-30c0-8 6-13 13-13c6 0 10 4 13 9c3-5 7-9 13-9c7 0 13 5 13 13c0 10-8 18-26 30z" fill="#a8652f"/><path d="M100 112c-9-6-13-10-13-15c0-4 3-6 6-6c3 0 5 2 7 5c2-3 4-5 7-5c3 0 6 2 6 6c0 5-4 9-13 15z" fill="#f1dfc2"/>`
};
const svgArt = k => `<svg viewBox="0 0 200 200" aria-hidden="true">${ART[k]}</svg>`;
const PLUS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const SUNI = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 1.5v2.2M10 16.3v2.2M1.5 10h2.2M16.3 10h2.2M4 4l1.6 1.6M14.4 14.4 16 16M4 16l1.6-1.6M14.4 5.6 16 4"/></g></svg>';
const ICONS = {
  ic1: '<svg viewBox="0 0 28 28" fill="none" stroke="var(--leaf)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22c0-9 6-15 17-16-1 11-7 17-16 17"/><path d="M6 22c3-5 7-8 12-10"/></svg>',
  ic2: '<svg viewBox="0 0 28 28" fill="none" stroke="var(--ic-sea)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13 14 5l10 8"/><path d="M7 11v12h14V11"/><path d="M12 23v-6h4v6"/></svg>',
  ic3: '<svg viewBox="0 0 28 28" fill="none" stroke="var(--tomato)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4 5 8v6c0 5 4 9 9 10 5-1 9-5 9-10V8z"/><path d="m10 14 3 3 5-6"/></svg>'
};

/* ===== cart ===== */
const cart = new Map();
const item = id => MENU.find(m => m.id === id);
const nm = id => t('m_' + id + '_n');
function addItem(id, dlt) {
  const q = Math.max(0, (cart.get(id) || 0) + dlt);
  if (q) cart.set(id, q); else cart.delete(id);
  renderCart();
}
function cartSum() { let s = 0, c = 0; cart.forEach((q, id) => { s += q * item(id).price; c += q; }); return { s, c }; }
function renderCart() {
  const ul = $('#cart'); ul.innerHTML = '';
  cart.forEach((q, id) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="cn">${esc(nm(id))}</span><span class="qty"><button type="button" aria-label="${esc(t('less'))}">−</button><span>${q}</span><button type="button" aria-label="${esc(t('more'))}">+</button></span><span class="cp">${eur(q * item(id).price)}</span>`;
    const [m, p] = li.querySelectorAll('button');
    m.onclick = () => addItem(id, -1); p.onclick = () => addItem(id, 1);
    ul.appendChild(li);
  });
  const { s, c } = cartSum();
  $('#cartEmpty').hidden = c > 0; $('#totalRow').hidden = c === 0;
  $('#total').textContent = eur(s);
  $$('.add[data-id]').forEach(b => { b.dataset.n = cart.get(b.dataset.id) || 0; });
  $('#cbText').textContent = fill(t(c === 1 ? 'cb_item' : 'cb_items'), { n: c, s: eur(s) });
  updateBar();
}
let orderVisible = false;
function updateBar() { $('#cartBar').hidden = cartSum().c === 0 || orderVisible; }
new IntersectionObserver(es => { es.forEach(en => { orderVisible = en.isIntersecting; }); updateBar(); }, { threshold: .08 }).observe($('#order'));

/* ===== menu ===== */
function renderMenu() {
  const s = status(), H = s.H || [8, 0, 17, 0];
  $('#menuLead').textContent = fill(t('menu_p'), { o: hhmm(H[0], H[1]), c: hhmm(H[2], H[3]) });
  $('#feat').innerHTML = MENU.filter(m => m.art).map(m => `<article class="dish"><div class="art">${svgArt(m.art)}</div><h3>${esc(nm(m.id))}</h3><p>${esc(I18N[lang]['m_' + m.id + '_f'] || t('m_' + m.id + '_d'))}</p><div class="row"><span class="price">${eur(m.price)}</span><button type="button" class="add" data-id="${m.id}" aria-label="${esc(fill(t('add'), { n: nm(m.id) }))}">${PLUS}</button></div></article>`).join('');
  $('#mlist').innerHTML = ['brunch', 'plates', 'drinks'].map(g => `<div class="mgroup"><h3>${esc(t('g_' + g))}</h3><ul>${MENU.filter(m => m.g === g).map(m => {
    const d = t('m_' + m.id + '_d');
    return `<li class="mi"><div class="mi-top"><span class="mi-n">${esc(nm(m.id))}</span><span class="dots"></span><span class="mi-p">${m.from ? `<small>${esc(t('from'))}</small>` : ''}${eur(m.price)}</span>${m.noOrder ? '' : `<button type="button" class="add sm" data-id="${m.id}" aria-label="${esc(fill(t('add'), { n: nm(m.id) }))}">${PLUS}</button>`}</div>${d ? `<p class="mi-d">${esc(d)}</p>` : ''}</li>`;
  }).join('')}</ul></div>`).join('');
  $$('.add[data-id]').forEach(b => { b.onclick = () => addItem(b.dataset.id, 1); });
  const names = ['syrniki', 'shakshuka', 'breakfast', 'omelette', 'cap_s', 'pastrami', 'soup', 'cocktails'].map(nm);
  const one = names.map(x => `<span>${esc(x)}${SUNI}</span>`).join('');
  $('#track').innerHTML = one + one;
}
function renderAllDay() {
  const n = Date.now(), d = today(), s = status();
  const H = hoursOf(d) || s.H || [8, 0, 17, 0];
  const o = at(d, H[0], H[1]), c = at(d, H[2], H[3]);
  const midH = Math.round((H[0] + H[2]) / 2);
  $('#adScale').innerHTML = `<span>${hhmm(H[0], H[1])}</span><span>${hhmm(midH, 0)}</span><span>${hhmm(H[2], H[3])}</span>`;
  const f = Math.max(0, Math.min(1, (n - o) / (c - o)));
  const nowEl = $('#adNow');
  nowEl.style.left = (f * 100) + '%';
  $('#adNowT').textContent = fill(t('ad_now'), { t: hm(n) });
  const oS = hhmm(H[0], H[1]), cS = hhmm(H[2], H[3]);
  let note;
  if (s.k === 'open') note = fill(t('ad_open'), { t: hm(n) });
  else if (s.k === 'later') note = fill(t('ad_before'), { o: oS, c: cS });
  else note = fill(t('ad_after'), { d: nextDayLabel(s, true), o: hhmm(s.H[0], s.H[1]), c: hhmm(s.H[2], s.H[3]) });
  $('#adNote').textContent = note;
}

/* ===== pickup form ===== */
function slots(day) {
  const H = hoursOf(day); if (!H) return [];
  const out = [], o = H[0] * 60 + H[1] + 15, c = H[2] * 60 + H[3] - 15, isT = sameDay(day, today());
  const p = tzParts(Date.now()), nowM = p.h * 60 + p.mi;
  for (let m = o; m <= c; m += 15) { if (isT && m < nowM + 20) continue; out.push(m); }
  return out;
}
let pickDays = [];
function renderDays() {
  const d0 = today(); pickDays = [];
  for (let i = 0; i < 10 && pickDays.length < 3; i++) { const d = addDays(d0, i); if (slots(d).length) pickDays.push({ d, i }); }
  const cur = ($('#dayChips input:checked') || {}).value;
  $('#dayChips').innerHTML = pickDays.map((x, k) => {
    const lbl = x.i === 0 ? t('d_today') : x.i === 1 ? t('d_tom') : dayName(x.d, { weekday: 'short', day: 'numeric', month: 'short' });
    const v = isoDay(x.d);
    return `<label class="chip"><input type="radio" name="day" value="${v}" ${(cur ? cur === v : k === 0) ? 'checked' : ''}><span>${esc(lbl)}</span></label>`;
  }).join('');
  if (!$('#dayChips input:checked') && $('#dayChips input')) $('#dayChips input').checked = true;
  $$('#dayChips input').forEach(i => { i.onchange = renderTimes; });
  renderTimes();
}
function renderTimes() {
  const v = ($('#dayChips input:checked') || {}).value, x = pickDays.find(p => isoDay(p.d) === v);
  const sel = $('#oTime'), cur = sel.value;
  const list = x ? slots(x.d) : [];
  sel.innerHTML = list.length ? list.map(m => { const s = hhmm(Math.floor(m / 60), m % 60); return `<option value="${s}" ${s === cur ? 'selected' : ''}>${s}</option>`; }).join('') : `<option value="">${esc(t('no_slots'))}</option>`;
}
function resultBox(box, msg) {
  const wa = SITE.whatsapp ? `<a class="btn sun sm" href="https://wa.me/${encodeURIComponent(SITE.whatsapp)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${esc(t('wa'))}</a>` : '';
  box.innerHTML = `<h4>${esc(t('res_h'))}</h4><pre>${esc(msg)}</pre><div class="acts"><button type="button" class="btn line sm cp">${esc(t('copy'))}</button>${wa}</div>${SITE.whatsapp ? '' : `<p class="cnote">${esc(t('res_note'))}</p>`}`;
  box.hidden = false;
  const b = box.querySelector('.cp');
  b.onclick = () => {
    const ok = () => { b.textContent = t('copied'); setTimeout(() => { b.textContent = t('copy'); }, 1800); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(box.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(msg).then(ok, sel); } catch (e) { sel(); }
  };
  box.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
$('#orderForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const err = $('#oErr'), f = ev.target, v = n => f.elements[n].value.trim();
  const { s, c } = cartSum();
  if (!c) { err.textContent = t('err_cart'); err.hidden = false; return; }
  if (!v('name') || !v('phone') || !v('time')) { err.textContent = t('err_req'); err.hidden = false; return; }
  err.hidden = true;
  const dv = ($('#dayChips input:checked') || {}).value, x = pickDays.find(p => isoDay(p.d) === dv);
  const dl = x ? (x.i === 0 ? t('d_today').toLowerCase() : x.i === 1 ? t('d_tom').toLowerCase() : dayName(x.d, { weekday: 'long', day: 'numeric', month: 'long' })) : '';
  const lines = [t('msg_hi')];
  cart.forEach((q, id) => lines.push(`• ${q}× ${nm(id)} — ${eur(q * item(id).price)}`));
  lines.push(`${t('msg_total')}: ${eur(s)}`, '', `${t('msg_pick')}: ${dl}, ${v('time')}`, `${t('msg_name')}: ${v('name')}`, `${t('msg_phone')}: ${v('phone')}`);
  if (v('note')) lines.push(`${t('msg_note')}: ${v('note')}`);
  resultBox($('#oRes'), lines.join('\n'));
});

/* ===== terrace: weekend sunsets + event request ===== */
function renderSunsets() {
  const d0 = today(), out = [];
  for (let i = 0; i < 21 && out.length < 6; i++) {
    const d = addDays(d0, i), w = dow(d);
    if (w !== 6 && w !== 0) continue;
    const off = tzOffset(at(d, 12, 0)), prev = tzOffset(at(addDays(d, -1), 12, 0));
    out.push(`<div class="ss"><small>${esc(dayName(d, { weekday: 'short', day: 'numeric', month: 'short' }))}</small><b>${hm(sunDay(d).set)}</b>${off !== prev ? `<em>${esc(t('dst'))}</em>` : ''}</div>`);
  }
  $('#sunsets').innerHTML = out.join('');
}
let evType = 'bday';
function renderEvTypes() {
  const T = t('ev_t');
  $('#evTypes').innerHTML = Object.keys(T).map(k => `<label class="chip"><input type="radio" name="etype" value="${k}" ${k === evType ? 'checked' : ''}><span>${esc(T[k])}</span></label>`).join('');
  $$('#evTypes input').forEach(i => { i.onchange = () => { evType = i.value; }; });
}
function evSunset() {
  const v = $('#eDate').value, el = $('#evSun');
  if (!v) { el.textContent = t('ev_pick'); return null; }
  const [y, m, d] = v.split('-').map(Number), s = hm(sunDay({ y, m, d }).set);
  el.innerHTML = `<span class="sun-dot"></span>${esc(fill(t('ev_sun'), { s }))}`;
  return s;
}
$('#eDate').addEventListener('input', evSunset);
$('#evForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, v = n => f.elements[n].value.trim(), err = $('#eErr');
  if (!v('date') || !v('name') || !v('contact')) { err.textContent = t('err_ev'); err.hidden = false; return; }
  err.hidden = true;
  const [y, m, d] = v('date').split('-').map(Number), day = { y, m, d };
  const lines = [t('msg_ev'), `${t('msg_date')}: ${dayName(day, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`];
  if (v('guests')) lines.push(`${t('msg_guests')}: ${v('guests')}`);
  lines.push(`${t('msg_type')}: ${t('ev_t')[evType]}`, `${t('msg_sunset')}: ${hm(sunDay(day).set)}`, `${t('msg_name')}: ${v('name')}`, `${t('msg_contact')}: ${v('contact')}`);
  resultBox($('#eRes'), lines.join('\n'));
});

/* ===== about, visit, footer ===== */
function renderAbout() { Object.keys(ICONS).forEach(k => { $('#' + k).innerHTML = ICONS[k]; }); }
function renderVisit() {
  const d = today(), w = dow(d), Hs = SITE.hours;
  const same = Hs.every(h => JSON.stringify(h) === JSON.stringify(Hs[0]));
  let hrs;
  if (same && Hs[0]) hrs = `<div class="hrs"><span class="today">${esc(t('every'))}</span><span class="today">${hhmm(Hs[0][0], Hs[0][1])}–${hhmm(Hs[0][2], Hs[0][3])}</span></div>`;
  else {
    const order = [1, 2, 3, 4, 5, 6, 0];
    hrs = `<div class="hrs">${order.map(i => { const dd = addDays(d, (i - w + 7) % 7), h = Hs[i], cls = i === w ? ' class="today"' : ''; const nmD = dayName(dd, { weekday: 'long' }); return `<span${cls}>${esc(nmD.charAt(0).toUpperCase() + nmD.slice(1))}</span><span${cls}>${h ? `${hhmm(h[0], h[1])}–${hhmm(h[2], h[3])}` : esc(t('closed'))}</span>`; }).join('')}</div>`;
  }
  const st = $('#status span').textContent;
  $('#info').innerHTML = `<li><span class="k">${esc(t('k_addr'))}</span><span class="v">${esc(SITE.address)}</span></li>
    <li><span class="k">${esc(t('k_hours'))}</span><span class="v">${hrs}<small>${esc(st)}</small></span></li>
    <li><span class="k">${esc(t('k_phone'))}</span><span class="v"><span id="phoneTxt">${esc(SITE.phone)}</span><button type="button" class="copy" id="copyPhone">${esc(t('copy'))}</button></span></li>`;
  $('#copyPhone').onclick = () => {
    const b = $('#copyPhone');
    const ok = () => { b.textContent = t('copied'); setTimeout(() => { b.textContent = t('copy'); }, 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('#phoneTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(SITE.phone).then(ok, sel); } catch (e) { sel(); }
  };
  $('#links').innerHTML = `<a class="btn line sm" href="${SITE.mapsUrl}" target="_blank" rel="noopener">${esc(t('maps'))} ↗</a>` + (SITE.instagram ? `<a class="btn line sm" href="https://www.instagram.com/${encodeURIComponent(SITE.instagram)}/" target="_blank" rel="noopener">@${esc(SITE.instagram)} ↗</a>` : '');
  $('#fnav').innerHTML = `<a href="#menu">${esc(t('nav_menu'))}</a><a href="#order">${esc(t('nav_order'))}</a><a href="#terrace">${esc(t('nav_terrace'))}</a><a href="#visit">${esc(t('nav_visit'))}</a><a href="${SITE.studio}" target="_blank" rel="noopener">${esc(t('foot_by'))} ↗</a>`;
}

/* ===== i18n & boot ===== */
function applyTexts() {
  document.documentElement.lang = lang;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function tick() { renderStatus(); renderTitle(); drawScene(); renderAllDay(); }
function renderAll() {
  applyTexts(); tick(); renderMenu(); renderCart(); renderDays(); renderSunsets(); renderEvTypes(); evSunset(); renderAbout(); renderVisit();
  if ($('#oRes').hidden === false) $('#oRes').hidden = true;
  if ($('#eRes').hidden === false) $('#eRes').hidden = true;
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('leto-lang', lang); } catch (e) {}
  renderAll();
}));
$('#eDate').min = isoDay(today());
renderAll();
setInterval(() => { tick(); renderVisit(); renderDays(); }, 30000);
</script>
