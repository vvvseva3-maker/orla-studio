<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Multicook de Cascais Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
/* Layout: flour-white kitchen page with a red cross-stitch band between rooms; a scroll scene shapes a varenyk,
   the freezer list says what is in today, the order becomes a Telegram message, and a timer cooks it at home. */
:root{
  --paper:#f8f6f1; --paper-2:#efebe2; --frost:#e2ebf1; --frost-ink:#2f5a78; --card:#fffefb; --ink:#1c1d2b; --ink-2:#3f4152; --muted:#6c6d7a; --line:#e6e1d6; --line-2:#cfc8b9;
  --red:#c2362b; --red-ink:#a52b22; --on-red:#fff8f2; --open:#2f7a46; --err:#b3261e;
  --foot:#1c1d2b; --on-foot:#f3efe6; --on-foot-muted:#a9a8b2;
  --display:'Unbounded','Arial Black','Segoe UI',system-ui,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --hdr:66px; --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121319; --paper-2:#191b23; --frost:#18242f; --frost-ink:#9cc4e0; --card:#1d1f28; --ink:#f2eee6; --ink-2:#d6d2c8; --muted:#9e9ca4; --line:#2c2e38; --line-2:#454755;
  --red:#ff7563; --red-ink:#ff9384; --on-red:#1a0f0d; --open:#6fcf8e; --err:#ff8a80;
  --foot:#0b0c10; --on-foot:#efebe2; --on-foot-muted:#97969f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#121319; --paper-2:#191b23; --frost:#18242f; --frost-ink:#9cc4e0; --card:#1d1f28; --ink:#f2eee6; --ink-2:#d6d2c8; --muted:#9e9ca4; --line:#2c2e38; --line-2:#454755;
  --red:#ff7563; --red-ink:#ff9384; --on-red:#1a0f0d; --open:#6fcf8e; --err:#ff8a80;
  --foot:#0b0c10; --on-foot:#efebe2; --on-foot-muted:#97969f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 16px + env(safe-area-inset-top, 0px))}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
em{font-style:normal;color:var(--red)}
.wrap{max-width:1220px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.eb{font:700 12px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--red-ink)}
.h2{font-size:clamp(32px,4.4vw,56px);line-height:1.02;margin-top:14px}
.lead{font-size:18px;color:var(--ink-2);max-width:54ch;margin-top:18px}
.sec{padding-block:clamp(72px,9vw,120px)}
.alt{background:var(--paper-2)}

/* ribbon */
.rib{background:var(--foot);color:var(--on-foot);font-size:13px;line-height:1.45}
.rib .wrap{padding-block:9px;display:flex;gap:12px;justify-content:center;align-items:center;text-align:center}
.rib b{background:var(--red);color:var(--on-red);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:26px;height:var(--hdr)}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex:none}
.logo b{font:800 21px/1 var(--display);letter-spacing:-.03em}
.logo b i{font-style:normal;color:var(--red)}
.logo small{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:24px;margin-left:auto}
.nav a{text-decoration:none;font-weight:600;font-size:15px;color:var(--ink-2)}
.nav a:hover{color:var(--red-ink)}
.lang{display:flex;gap:2px;background:var(--paper-2);border-radius:8px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:700 12px/1 var(--sans);letter-spacing:.06em;padding:8px 9px;border-radius:6px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:12px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);font:700 15.5px/1.1 var(--sans);text-decoration:none;cursor:pointer;text-align:center;transition:background .2s,border-color .2s,color .2s,transform .15s}
.btn:hover{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn:active{transform:translateY(1px)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.red:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{min-height:42px;padding:0 16px;font-size:14.5px}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px;flex:none}
@media (max-width:980px){ .nav{display:none} .lang{margin-left:auto} .hdr-in{gap:10px} }
@media (max-width:420px){ .logo small{display:none} .hdr .btn{padding:0 12px} .lang button{padding:8px 7px} }

/* cross-stitch band: red and ink crosses, a rhombus and a little star repeating */
.stitch{height:var(--sh,66px);line-height:0;overflow:hidden;background:var(--paper)}
.stitch svg{display:block;width:100%;height:100%}
.stitch .sr{stroke:var(--red)} .stitch .sk{stroke:var(--ink)}
.stitch path{fill:none;stroke-width:1.6;stroke-linecap:round}

/* hero */
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;padding-block:clamp(56px,8vw,104px) clamp(44px,6vw,72px)}
.hero h1{font-size:clamp(38px,5vw,68px);line-height:1;font-weight:800;letter-spacing:-.035em;margin-top:20px}
.hero .lead{font-size:19px;margin-top:24px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.facts{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.facts li{font-size:14px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--paper-2);color:var(--ink-2)}
.facts li.fz{background:var(--frost);color:var(--frost-ink)}
.hero-art{margin:0;width:100%;max-width:600px;justify-self:end}
@media (max-width:880px){ .hero-in{grid-template-columns:1fr} .hero-art{justify-self:center;max-width:470px} }
@media (max-width:560px){ .ctas .btn{flex:1 1 220px} }

/* food drawings: fixed colours, they are food */
.f{display:block;width:100%;height:auto;overflow:visible}
.f *{vector-effect:non-scaling-stroke}
.f .o{stroke:#26252f;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.f .l{fill:none;stroke:#26252f;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f .l2{fill:none;stroke:rgba(38,37,47,.38);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.f .no{fill:none}
.f .dg{fill:#f8ead0} .f .dg2{fill:#ecd5aa} .f .wd{fill:#dca86e} .f .wd2{fill:#c98d50} .f .wg{fill:none;stroke:#b67a41;stroke-width:1.2;stroke-linecap:round}
.f .fl{fill:#fffdf8} .f .ch{fill:#b51f30} .f .chd{fill:#7d1220} .f .gr{fill:#6f9a3a} .f .grl{fill:none;stroke:#5f8a2c;stroke-width:1.6;stroke-linecap:round}
.f .cr{fill:#fffcf4} .f .bl{fill:#2c4f93} .f .bll{fill:#dfe7f5} .f .sy{fill:#e4a55c} .f .syl{fill:#f4c886} .f .kr{fill:#d9b98a}
.f .gl{fill:rgba(220,236,246,.35);stroke:#26252f;stroke-width:2} .f .wa{fill:#cfe2ec} .f .wa2{fill:none;stroke:#9cc2d6;stroke-width:1.6}
.f .st{fill:#c5c9cf} .f .std{fill:#8e949c} .f .stm{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round}
.f .hi{fill:#fff;opacity:.55} .f .tag{fill:#fffdf6} .f .tagt{fill:#26252f;font:700 13px var(--sans);letter-spacing:.04em} .f .tagr{fill:#c2362b;font:800 22px var(--display)}
.f .ring{fill:none;stroke:var(--line-2);stroke-width:5} .f .ringf{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round}
.f .tt{fill:var(--ink);font:800 30px var(--display);letter-spacing:-.02em} .f .ts{fill:var(--muted);font:600 13px var(--sans)}

/* the scroll scene: one varenyk, from dough to pot */
.vk{position:relative;height:330vh}
.vk-pin{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top, 0px));height:calc(100vh - var(--hdr));height:calc(100svh - var(--hdr) - env(safe-area-inset-top, 0px));overflow:hidden;display:flex;align-items:center}
.vk-in{width:100%;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,64px);align-items:center}
.vk-copy{min-width:0}
.vk-n{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.vk-n b{font:800 clamp(84px,10vw,150px)/.85 var(--display);letter-spacing:-.06em;color:var(--red)}
.vk-n span{font:700 14px/1 var(--sans);color:var(--muted);letter-spacing:.08em}
.vk-step{margin-top:20px;transition:opacity .25s ease,transform .25s ease}
.vk-step.swap{opacity:0;transform:translateY(6px)}
.vk-step h3{font-size:clamp(24px,2.5vw,34px);line-height:1.08}
.vk-step p{margin-top:10px;color:var(--ink-2);max-width:42ch;min-height:3.2em}
.vsteps{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0;padding:0;list-style:none}
.vsteps li{font:700 12.5px/1 var(--sans);padding:8px 11px;border-radius:7px;border:1.5px solid var(--line-2);color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.vsteps li.done{border-color:var(--red);color:var(--red-ink)}
.vsteps li.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.vk-cue{margin-top:20px;font-size:14px;color:var(--muted)}
.vk-art{margin:0;min-width:0}
.vk-art .f .board{fill:var(--paper-2);stroke:var(--line-2);stroke-width:1.5}
.vk-art .f .flour{fill:var(--card);opacity:.85}
@media (max-width:860px){
  .vk{height:310vh}
  .vk-in{grid-template-columns:minmax(0,1fr);gap:0}
  .vk-n{margin-top:4px}
  .vk-n b{font-size:clamp(60px,18vw,88px)}
  .vk-step{margin-top:8px}
  .vk-step h3{font-size:23px}
  .vk-step p{font-size:15px;line-height:1.45;min-height:2.9em;margin-top:6px}
  .vsteps{margin-top:12px;gap:4px}
  .vsteps li{padding:7px 8px;font-size:11.5px}
  .vk-cue{display:none}
  .vk-art{width:min(100%, calc((100svh - var(--hdr) - 360px) * 1.36));justify-self:center;margin-top:14px}
}
.vk.static{height:auto}
.vk.static .vk-pin{position:relative;top:0;height:auto;padding-block:clamp(72px,9vw,120px)}

/* freezer list + order */
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:clamp(32px,5vw,64px);align-items:start}
.menu-main{min-width:0}
.mtools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:30px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1.5px solid var(--line-2);background:var(--card);border-radius:8px;padding:9px 13px;font:700 14px/1 var(--sans);cursor:pointer;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--red);margin:0}
.mgroup{margin-top:38px}
.mgroup h3{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:24px;line-height:1.1;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.mgroup h3 small{font:600 13px var(--sans);color:var(--muted);letter-spacing:0}
.mgroup ul{list-style:none;margin:0;padding:0}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding-block:15px;border-bottom:1px solid var(--line)}
.mi-n{font:700 17.5px/1.3 var(--sans);letter-spacing:-.005em;min-width:0}
.mi-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:14px;color:var(--muted)}
.mi-r{display:flex;align-items:center;gap:14px}
.mi-p{font:700 16px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tg{font:700 11.5px/1 var(--sans);letter-spacing:.02em;padding:5px 8px;border-radius:6px;white-space:nowrap;border:1px solid var(--line-2);color:var(--ink-2)}
.tg.in{background:color-mix(in srgb, var(--open) 14%, transparent);border-color:transparent;color:var(--open)}
.tg.ord{color:var(--muted)}
.tg.fz{background:var(--frost);border-color:transparent;color:var(--frost-ink)}
.tg.nw{background:var(--red);border-color:var(--red);color:var(--on-red)}
.tg.np,.tg.lim{border-style:dashed}
.add{position:relative;width:42px;height:42px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .2s,transform .15s}
.add svg{width:15px;height:15px}
.add:hover{background:var(--red);color:var(--on-red)}
.add:active{transform:scale(.94)}
.add[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;border-radius:11px;background:var(--red);color:var(--on-red);font:800 11.5px/21px var(--sans);text-align:center;padding:0 5px;border:2px solid var(--paper)}
.ckl{font-weight:700;font-size:13.5px;color:var(--red-ink);text-decoration:none;white-space:nowrap}
.ckl:hover{text-decoration:underline}
.partners{margin-top:30px;padding:16px 18px;border-radius:14px;background:var(--paper-2);font-size:15px;color:var(--ink-2)}
.order{position:sticky;top:calc(var(--hdr) + 20px + env(safe-area-inset-top, 0px));min-width:0}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px}
.order .ocard{max-height:calc(100vh - var(--hdr) - 40px);overflow:auto;overscroll-behavior:contain}
.ocard h2{font-size:24px;line-height:1.1;margin-top:10px}
.small{font-size:15px;color:var(--muted);margin-top:10px}
.cart{list-style:none;margin:18px 0 0;padding:0}
.cart li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);font-size:15px}
.qty{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.qty button{width:28px;height:28px;border:1px solid var(--line-2);background:var(--paper);border-radius:7px;cursor:pointer;line-height:1;padding:0}
.qty button:hover{border-color:var(--ink)}
.cp{font-variant-numeric:tabular-nums;min-width:54px;text-align:right;font-weight:700}
.empty{margin-top:18px;padding:16px;border:2px dashed var(--line-2);border-radius:14px;font-size:14.5px;color:var(--muted);text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-weight:700}
.total b{font:800 24px/1 var(--display)}
form{display:grid;gap:14px}
.ocard form{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.lbl{display:block;font:700 13px/1.2 var(--sans);color:var(--ink-2);padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip > span{display:block;padding:9px 13px;border:1.5px solid var(--line-2);border-radius:9px;font-size:14.5px;line-height:1.25;background:var(--paper)}
.chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.chip input:disabled+span{opacity:.4;text-decoration:line-through}
input[type=text],input[type=tel],select{display:block;width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line-2);background:var(--paper);border-radius:11px;font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{font-size:13.5px;color:var(--muted)}
.err{color:var(--err);font-size:14.5px}
.res{margin-top:18px;border-radius:16px;padding:18px;background:var(--paper-2);border:1.5px solid var(--red)}
.res h4{font-size:19px}
.res pre{white-space:pre-wrap;word-break:break-word;font:15px/1.55 var(--sans);margin:10px 0 0;color:var(--ink)}
.res .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cnote{font-size:13.5px;color:var(--muted);margin-top:12px}
@media (max-width:1020px){ .menu-grid{grid-template-columns:1fr} .order{position:static} .order .ocard{max-height:none;overflow:visible} }
@media (max-width:560px){ .mi-n{font-size:16.5px} .ocard{padding:22px 18px} .mgroup h3{font-size:21px} .mi-r{gap:10px} }

/* kitchen timer */
.cook-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center}
.cook-grid > *{min-width:0}
.ctypes{margin-top:28px}
.csteps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.csteps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:start;font-size:16.5px;color:var(--ink-2)}
.csteps li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:800 14px/1 var(--display)}
.timer{display:grid;justify-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,40px)}
.timer svg{width:min(100%,300px);height:auto}
.timer .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.timer .done{font:700 18px/1.3 var(--display);color:var(--open);min-height:1.3em;text-align:center}
@media (max-width:880px){ .cook-grid{grid-template-columns:1fr} }

/* telegram + visit */
.tg-card{background:var(--foot);color:var(--on-foot);border-radius:28px;padding:clamp(26px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px 48px;align-items:center;position:relative;overflow:hidden}
.tg-card .eb{color:#ff9384}
.tg-card h2{font-size:clamp(28px,3.6vw,46px);line-height:1.05;margin-top:12px}
.tg-card p{color:var(--on-foot-muted);margin-top:14px;max-width:48ch}
.tg-card .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.tg-card .btn{background:var(--on-foot);border-color:var(--on-foot);color:var(--foot)}

function ckTick(now) {

/* ===== Telegram, contacts, footer ===== */
function renderVisit() {
  const sh = SITE.shopTelegram, ch = SITE.channelTelegram;
  $('#tgLinks').innerHTML = (ch ? `<a class="btn" href="https://t.me/${encodeURIComponent(ch)}" target="_blank" rel="noopener">${PLANE}${esc(t('tg_sub'))} @${esc(ch)}</a>` : '') + (sh ? `<a class="btn line" href="https://t.me/${encodeURIComponent(sh)}" target="_blank" rel="noopener">${esc(t('tg_write'))} ↗</a>` : '');
  const rows = [[t('k_order'), sh ? '@' + sh : ''], [t('k_news'), ch ? '@' + ch : ''], [t('k_where'), SITE.address || t('where')], [t('k_del'), t('areas').join(' · ')]];
  $('#facts2').innerHTML = rows.filter(r => r[1]).map(([k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('');
  $('#studioLink').href = SITE.studio;
}

/* ===== i18n & boot ===== */
function applyTexts() {
  document.documentElement.lang = LOC[lang].slice(0, 2) === 'pt' ? 'pt-PT' : lang;
  $$('[data-t]').forEach(el => { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  $$('[data-th]').forEach(el => { el.innerHTML = t(el.dataset.th); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function renderAll() {
  applyTexts(); heroArt(); vkBuild(); renderMenu(); renderHow(); renderDays(); renderCook(); renderVisit();
  $('#oRes').hidden = true;
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('mc-lang', lang); } catch (e) {}
  renderAll();
}));
$$('[data-stitch]').forEach(stitch);
let sw = innerWidth;
addEventListener('resize', () => { if ((innerWidth < 600) !== (sw < 600)) { sw = innerWidth; $$('[data-stitch]').forEach(stitch); } });
renderAll();
setInterval(renderDays, 60000);
</script>
</body>
</html>
