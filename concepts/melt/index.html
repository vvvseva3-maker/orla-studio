<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Melt Bakery Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --milk:#fbf8f3; --milk-2:#f4ede3; --pink:#f6ddd6; --card:#fffdf9; --ink:#2a1812; --ink-2:#4f3b31; --muted:#7a665b; --line:#ebdfd2; --line-2:#d5c4b4;
  --caramel:#c4651f; --caramel-ink:#a5531a; --on-caramel:#fffaf3; --matcha:#55772a; --err:#b3261e; --open:#3f7a2a;
  --foot:#2a1812; --on-foot:#f6efe6; --on-foot-muted:#bba99c;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --hdr:66px; --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --milk:#1a110d; --milk-2:#22170f; --pink:#33211c; --card:#251912; --ink:#f6ece1; --ink-2:#ddcfc2; --muted:#a99689; --line:#3a2a21; --line-2:#56412f;
  --caramel:#e2893f; --caramel-ink:#f0a35e; --on-caramel:#1a110d; --matcha:#a7c76c; --err:#ff8a80; --open:#8fd16a;
  --foot:#0f0a07; --on-foot:#efe6dc; --on-foot-muted:#9c8b7f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --milk:#1a110d; --milk-2:#22170f; --pink:#33211c; --card:#251912; --ink:#f6ece1; --ink-2:#ddcfc2; --muted:#a99689; --line:#3a2a21; --line-2:#56412f;
  --caramel:#e2893f; --caramel-ink:#f0a35e; --on-caramel:#1a110d; --matcha:#a7c76c; --err:#ff8a80; --open:#8fd16a;
  --foot:#0f0a07; --on-foot:#efe6dc; --on-foot-muted:#9c8b7f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 16px + env(safe-area-inset-top, 0px))}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{background:var(--milk);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--milk)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
em{font-style:normal;color:var(--caramel-ink)}
.wrap{max-width:1220px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.eb{font:600 12.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--caramel-ink)}
.h2{font-size:clamp(34px,4.8vw,62px);line-height:1;margin-top:14px;font-weight:800;letter-spacing:-.035em}
.lead{font-size:18px;color:var(--ink-2);max-width:54ch;margin-top:18px}
.sec{padding-block:clamp(72px,9vw,120px)}
.alt{background:var(--milk-2)}
.pinkbg{background:var(--pink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.on .dot{background:var(--open);box-shadow:0 0 0 4px color-mix(in srgb, var(--open) 22%, transparent)}

/* ribbon */
.rib{background:var(--foot);color:var(--on-foot);font-size:13px;line-height:1.45}
.rib .wrap{padding-block:9px;display:flex;gap:12px;justify-content:center;align-items:center;text-align:center}
.rib b{background:var(--caramel);color:var(--on-caramel);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--milk)}
.hdr-in{display:flex;align-items:center;gap:26px;height:var(--hdr)}
.logo{display:flex;align-items:flex-start;gap:2px;text-decoration:none;flex:none;font:800 30px/1 var(--display);letter-spacing:-.05em}
.logo svg{width:9px;height:16px;margin-top:17px;fill:var(--caramel)}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{text-decoration:none;font-weight:500;font-size:15.5px;color:var(--ink-2)}
.nav a:hover{color:var(--caramel-ink)}
.lang{display:flex;gap:2px;background:var(--milk-2);border-radius:999px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:600 12.5px/1 var(--sans);letter-spacing:.06em;padding:8px 10px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--milk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--milk);border:2px solid var(--ink);font:600 15.5px/1.1 var(--sans);text-decoration:none;cursor:pointer;text-align:center;transition:background .2s,border-color .2s,color .2s,transform .15s}
.btn:hover{background:var(--caramel);border-color:var(--caramel);color:var(--on-caramel)}
.btn:active{transform:translateY(1px)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.btn.sm{min-height:42px;padding:0 18px;font-size:14.5px}
.btn.wide{width:100%}
@media (max-width:940px){ .nav{display:none} .lang{margin-left:auto} .hdr-in{gap:12px} }
@media (max-width:380px){ .hdr .btn{padding:0 14px} .lang button{padding:8px 8px} }

/* glaze */
.glaze{position:absolute;inset:0 0 auto;line-height:0;pointer-events:none;overflow:hidden}
.glaze svg{display:block}
.glaze .band,.glaze .drip path{fill:var(--caramel)}
.glaze .drip ellipse{fill:#fff;opacity:.28}
.glaze.milkdrip .band,.glaze.milkdrip .drip path{fill:var(--milk-2)}
.glaze.milkdrip .drip ellipse{display:none}
.drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 7s ease-in-out infinite alternate}
@keyframes drip{from{transform:scaleY(.9)}to{transform:scaleY(1.08)}}
@media (prefers-reduced-motion: reduce){ .drip{animation:none} }

/* hero */
.hero{position:relative}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;padding-block:clamp(84px,10vw,128px) clamp(48px,6vw,80px)}
.hero h1{font-size:clamp(54px,8.4vw,118px);line-height:.9;font-weight:800;letter-spacing:-.05em;margin-top:20px}
.hero .lead{font-size:19px;margin-top:24px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-weight:600;font-size:15px}
.facts{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.facts li{font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--milk-2);color:var(--ink-2)}
.hero-art{margin:0;width:100%;max-width:600px;justify-self:end}
@media (max-width:880px){ .hero-in{grid-template-columns:1fr} .hero-art{justify-self:center;max-width:480px} }
@media (max-width:560px){ .ctas .btn{flex:1 1 220px} }

/* food drawings — fixed colours, they are food */
.f{display:block;width:100%;height:auto;overflow:visible}
.f *{vector-effect:non-scaling-stroke}
.f .o{stroke:#2a1812;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.f .l{fill:none;stroke:#2a1812;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f .l2{fill:none;stroke:rgba(42,24,18,.42);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.f .no{fill:none}
.f .bk{fill:#e8b366} .f .bkd{fill:#cf8a45} .f .bkl{fill:#f4d394} .f .cr{fill:#fff2dc} .f .wh{fill:#fffdf8}
.f .ca{fill:#b9611f} .f .rb{fill:#cf3a50} .f .rb2{fill:#e86a7b} .f .bb{fill:#3e3767} .f .lf{fill:#6f9a3a}
.f .dt{fill:#7a4126} .f .mt{fill:#a8c46a} .f .kr{fill:#e9d2ae} .f .bn{fill:#f6d77a} .f .fm{fill:#f39c34}
.f .hi{fill:#fff;opacity:.55} .f .fl{fill:#fff8ec;opacity:.7} .f .pk{fill:var(--pink)} .f .cb{fill:var(--caramel)}
.f .crumb{fill:#cf8a45}
.badge .spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 36s linear infinite}
.badge text{font:700 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;fill:var(--on-caramel)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .badge .spin{animation:none} }

/* menu + pickup */
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:clamp(32px,5vw,64px);align-items:start}
.menu-main{min-width:0}
.sub{font:600 12.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:52px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dish .art{background:var(--pink);border-radius:16px;aspect-ratio:4/3;display:grid;place-items:center;padding:8px 20%;max-width:100%}
.dish h3{font-size:24px;line-height:1.1;margin-top:10px}
.dish p{font-size:15px;color:var(--muted);line-height:1.5;flex:1}
.dish .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.price{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 11.5px/1 var(--sans);letter-spacing:.04em;padding:5px 9px;border-radius:999px;border:1px solid currentColor;color:var(--matcha);white-space:nowrap}
.tag.gf{color:var(--caramel-ink)}
.add{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--milk);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .2s,transform .15s}
.add svg{width:15px;height:15px}
.add:hover{background:var(--caramel);color:var(--on-caramel)}
.add:active{transform:scale(.94)}
.add[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;min-width:21px;height:21px;border-radius:11px;background:var(--caramel);color:var(--on-caramel);font:700 11.5px/21px var(--sans);text-align:center;padding:0 5px;border:2px solid var(--milk)}
.add.sm{width:36px;height:36px}
.mgroup{margin-top:52px}
.mgroup h3{font-size:30px;line-height:1.1;font-weight:800;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.mgroup ul{list-style:none;margin:0;padding:0}
.mi{padding-block:15px;border-bottom:1px solid var(--line)}
.mi-top{display:flex;align-items:center;gap:12px}
.mi-n{font:600 19px/1.25 var(--display);letter-spacing:-.01em;min-width:0}
.dots{flex:1;min-width:12px;border-bottom:2px dotted var(--line-2);align-self:flex-end;margin-bottom:8px}
.mi-p{font:700 16.5px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mi-d{font-size:15px;color:var(--muted);margin-top:4px;max-width:52ch;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.mi .nadd{width:36px;flex:none}
.order{position:sticky;top:calc(var(--hdr) + 20px + env(safe-area-inset-top, 0px));min-width:0}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px 24px}
.order .ocard{max-height:calc(100vh - var(--hdr) - 40px);overflow:auto;overscroll-behavior:contain}
.ocard h2{font-size:28px;line-height:1.08;margin-top:10px;font-weight:800}
.small{font-size:15px;color:var(--muted);margin-top:10px}
.cart{list-style:none;margin:18px 0 0;padding:0}
.cart li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);font-size:15px}
.qty{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.qty button{width:28px;height:28px;border:1px solid var(--line-2);background:var(--milk);border-radius:50%;cursor:pointer;line-height:1;padding:0}
.qty button:hover{border-color:var(--ink)}
.cp{font-variant-numeric:tabular-nums;min-width:54px;text-align:right;font-weight:600}
.empty{margin-top:18px;padding:16px;border:2px dashed var(--line-2);border-radius:16px;font-size:14.5px;color:var(--muted);text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-weight:600}
.total b{font:800 26px/1 var(--display)}
form{display:grid;gap:14px}
.ocard form{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.ocard > form:first-child{margin-top:0;padding-top:0;border-top:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.lbl{display:block;font:600 13px/1.2 var(--sans);color:var(--ink-2);padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip > span{display:block;padding:9px 14px;border:1.5px solid var(--line-2);border-radius:999px;font-size:14.5px;line-height:1.25;background:var(--milk)}
.chip input:checked+span{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--caramel);outline-offset:2px}
.chips.col{flex-direction:column}
.chips.col .chip > span{border-radius:14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.chips.col .chip small{color:inherit;opacity:.7;font-size:13px;white-space:nowrap}
input[type=text],input[type=tel],input[type=date],select,textarea{display:block;width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line-2);background:var(--milk);border-radius:14px;font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--caramel);outline-offset:0;border-color:var(--caramel)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--caramel);margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{color:var(--err);font-size:14.5px}
.res{margin-top:18px;border-radius:18px;padding:18px;background:var(--milk-2);border:1.5px solid var(--caramel)}
.res h4{font-size:22px}
.res pre{white-space:pre-wrap;word-break:break-word;font:15px/1.55 var(--sans);margin:10px 0 0;color:var(--ink)}
.res .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cnote{font-size:13.5px;color:var(--muted);margin-top:12px}
@media (max-width:1020px){ .menu-grid{grid-template-columns:1fr} .order{position:static} .order .ocard{max-height:none;overflow:visible} }
@media (max-width:560px){
  .feat{grid-template-columns:1fr;gap:14px}
  .dish{display:grid;grid-template-columns:112px minmax(0,1fr);column-gap:16px;row-gap:4px;padding:12px}
  .dish .art{grid-row:1 / span 3;aspect-ratio:1;padding:10px;align-self:start}
  .dish > :not(.art){grid-column:2}
  .dish h3{font-size:21px;margin-top:2px}
  .dish p{font-size:14px}
  .mgroup h3{font-size:26px}
  .mi-n{font-size:17.5px}
  .ocard{padding:22px 18px;border-radius:24px}
}

/* cakes */
.cake-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:start}
.cake-grid > *{min-width:0}
.cake-art{max-width:400px;margin:28px 0 0}
.lead-note{display:flex;gap:12px;align-items:flex-start;margin-top:26px;padding:16px 18px;border-radius:18px;background:var(--card);font-size:15.5px;color:var(--ink-2);max-width:52ch}
.lead-note b{font:800 22px/1 var(--display);color:var(--caramel-ink);flex:none;margin-top:2px}
.est{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 0;border-top:1px solid var(--line)}
.est b{font:800 30px/1 var(--display)}
.est small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
@media (max-width:880px){ .cake-grid{grid-template-columns:1fr} .cake-art{max-width:300px} }

/* house */
.house-grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(32px,5vw,80px);align-items:start}
.house-grid > *{min-width:0}
.route{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 0}
.route li{display:flex;align-items:center;font-weight:600;font-size:15px;color:var(--ink-2)}
.route li:not(:last-child)::after{content:"";width:18px;border-top:2px dotted var(--line-2);margin-inline:8px}
.route li:last-child{color:var(--on-caramel);background:var(--caramel);padding:6px 12px;border-radius:999px}
.team{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.team li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 16px 16px}
.team .ic{background:var(--pink);border-radius:16px;aspect-ratio:1;padding:10px;display:grid;place-items:center}
.team h3{font-size:22px;font-weight:800}
.team p{font-size:15.5px;color:var(--ink-2);margin-top:4px}
.b2b{margin-top:clamp(40px,5vw,64px);background:var(--foot);color:var(--on-foot);border-radius:28px;padding:clamp(24px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:center}
.b2b h3{font-size:clamp(24px,2.6vw,32px);font-weight:800}
.b2b p{color:var(--on-foot-muted);margin-top:8px;max-width:58ch}
.b2b .btn{background:var(--caramel);border-color:var(--caramel);color:var(--on-caramel)}
.b2b .btn:hover{background:var(--on-foot);border-color:var(--on-foot);color:var(--foot)}
@media (max-width:880px){ .house-grid{grid-template-columns:1fr} .b2b{grid-template-columns:1fr} }

/* visit */
.vi-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,5vw,80px);align-items:start}
.vi-grid > *{min-width:0}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.info{list-style:none;margin:0;padding:0;background:var(--card);border-radius:28px;border:1px solid var(--line);padding:6px 24px}
.info li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.info li:last-child{border:0}
.info .k{font:600 13px/1.9 var(--sans);color:var(--muted)}
.info .v{font:600 19px/1.4 var(--display);min-width:0;overflow-wrap:anywhere}
.hrs{display:grid;grid-template-columns:auto auto;justify-content:start;gap:3px 28px;font-weight:500}
.hrs .today{color:var(--caramel-ink);font-weight:800}
.hrs .off{color:var(--muted)}
.info small{display:block;font:500 14.5px/1.4 var(--sans);color:var(--muted);margin-top:8px}
@media (max-width:860px){ .vi-grid{grid-template-columns:1fr} }
@media (max-width:480px){ .info li{grid-template-columns:1fr;gap:4px} .info{padding:4px 18px} }

/* footer */
.foot{position:relative;background:var(--foot);color:var(--on-foot);padding-block:110px 40px}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 48px;align-items:end}
.wm{font:800 clamp(96px,17vw,230px)/.8 var(--display);letter-spacing:-.06em}
.foot p{color:var(--on-foot-muted);font-size:14.5px;margin-top:22px}
.fnav{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:15px}
.fnav a{text-decoration:none;color:var(--on-foot)}
.fnav a:hover{color:var(--caramel)}
@media (max-width:760px){ .foot-in{grid-template-columns:1fr} }

/* mobile pickup bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:14px var(--gut-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gut-l);background:linear-gradient(transparent,var(--milk) 40%)}
.cartbar a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:0 22px;background:var(--ink);color:var(--milk);border-radius:999px;text-decoration:none;font-size:15.5px;font-weight:500;max-width:520px;margin-inline:auto}
.cartbar b{font-weight:700}
</style>

        <p class="status" id="status"><i class="dot"></i><span></span></p>
        <ul class="facts"><li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li></ul>
      </div>
      <figure class="hero-art"><svg class="f" id="heroArt" viewBox="0 0 560 520" role="img"></svg></figure>
    </div>

          </form>
          <div class="res" id="oRes" hidden></div>
        </div>
      </aside>
    </div>
  </section>

  <section class="sec pinkbg" id="cakes">
    <div class="wrap cake-grid">
      <div>
        <p class="eb" data-t="cake_eb"></p>
        <h2 class="h2" data-t="cake_h"></h2>
        <p class="lead" data-t="cake_p"></p>
        <p class="lead-note" id="leadNote"></p>
        <div class="cake-art"><svg class="f" id="cakeArt" viewBox="0 0 240 240" aria-hidden="true"></svg></div>
      </div>
      <div class="ocard">
        <form id="cakeForm" novalidate>
          <fieldset><legend data-t="k_flavour"></legend><div class="chips" id="flavours"></div></fieldset>
          <fieldset><legend data-t="k_size"></legend><div class="chips col" id="sizes"></div></fieldset>
          <label class="check"><input type="checkbox" id="kGf" name="gf"><span data-t="k_gf"></span></label>
          <div><label class="lbl" for="kText" data-t="k_text"></label><input type="text" id="kText" name="text" maxlength="32" data-tp="k_text_ph"></div>
          <div class="two">
            <div><label class="lbl" for="kDate" data-t="k_date"></label><input type="date" id="kDate" name="date"></div>
            <div><label class="lbl" for="kTime" data-t="f_time"></label><select id="kTime" name="time"></select></div>
          </div>
          <div class="two">
            <div><label class="lbl" for="kName" data-t="f_name"></label><input type="text" id="kName" name="name" autocomplete="name"></div>
            <div><label class="lbl" for="kPhone" data-t="f_phone"></label><input type="tel" id="kPhone" name="phone" autocomplete="tel"></div>
          </div>
          <div class="est"><div><span data-t="k_est"></span><small data-t="k_est_note"></small></div><b id="kEst"></b></div>
          <p class="err" id="kErr" hidden></p>
          <button class="btn wide" type="submit" data-t="k_send"></button>
        </form>
        <div class="res" id="kRes" hidden></div>
      </div>
    </div>
  </section>

  <section class="sec" id="house">
    <div class="wrap house-grid">
      <div>
        <p class="eb" data-t="house_eb"></p>
        <h2 class="h2" data-t="house_h"></h2>
        <p class="lead" data-t="house_p"></p>
        <ol class="route" id="route"></ol>
      </div>
      <ul class="team" id="team"></ul>
    </div>
    <div class="wrap">
      <div class="b2b"><div><h3 data-t="b2b_h"></h3><p data-t="b2b_p"></p></div><a class="btn" id="b2bLink" target="_blank" rel="noopener" data-t="b2b_cta"></a></div>
    </div>
  </section>

  <section class="sec alt" id="visit">
    <div class="wrap vi-grid">
      <div>
        <p class="eb" data-t="vi_eb"></p>
        <h2 class="h2" data-t="vi_h"></h2>
        <p class="lead" data-t="vi_p"></p>
        <div class="links" id="links"></div>
      </div>
      <ul class="info" id="info"></ul>
    </div>
  </section>
</main>

</footer>

function glaze(el) {

  el.dataset.w = w; el.dataset.l = lang;
  const foot = el.classList.contains('milkdrip');
  const H = foot ? (w < 600 ? 54 : 78) : (w < 600 ? 62 : 100), band = foot ? 10 : 14;
  const R = rnd(+el.dataset.seed || 3);
  let x = 14 + R() * 26, d = '';

    d += `<g class="drip" style="animation-delay:${(-R() * 7).toFixed(2)}s"><path d="${drop(x, band - 1, L, r, r + 4 + R() * 5)}"/><ellipse cx="${f1(x - r * .35)}" cy="${f1(L - r * 1.15)}" rx="${f1(r * .22)}" ry="${f1(r * .42)}"/></g>`;
    x += 34 + R() * 84;
  }
  el.innerHTML = `<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}"><rect class="band" width="${w}" height="${band}"/>${d}</svg>`;
}

  if (!$('#kDate').value) $('#kDate').value = isoDay(first);
  $('#flavours').innerHTML = CAKES.flavours.map(k => `<label class="chip"><input type="radio" name="flavour" value="${k}" ${k === flavour ? 'checked' : ''}><span>${esc(t('fl_' + k))}</span></label>`).join('');
  $('#sizes').innerHTML = CAKES.sizes.map(z => `<label class="chip"><input type="radio" name="size" value="${z.id}" ${z.id === size ? 'checked' : ''}><span><span>${esc(t('sz_' + z.id))} · ${esc(t('sz_' + z.id + '_p'))}</span><small>${eur(z.price)}</small></span></label>`).join('');
  $$('#flavours input').forEach(i => { i.onchange = () => { flavour = i.value; }; });
  $$('#sizes input').forEach(i => { i.onchange = () => { size = i.value; renderEstimate(); }; });
  renderCakeTimes(); renderEstimate();
}
function cakeDateCheck() {
  const v = $('#kDate').value; if (!v) return { ok: false };
  const d = parseIso(v), first = earliestCakeDay();
  if (!hoursOf(d)) return { ok: false, msg: t('err_mon') };
  if (isoDay(d) < isoDay(first)) return { ok: false, msg: fill(t('err_early'), { h: SITE.cakeLeadHours, d: longDay(first) }) };
  return { ok: true, d };
}
function renderCakeTimes() {
  const c = cakeDateCheck(), err = $('#kErr');
  if (c.msg) { err.textContent = c.msg; err.hidden = false; } else if ($('#kDate').value) err.hidden = true;
  $('#kTime').innerHTML = timeOpts(c.ok ? cakeSlots(c.d) : [], $('#kTime').value);
}
function cakePrice() { return CAKES.sizes.find(z => z.id === size).price + ($('#kGf').checked ? CAKES.gf : 0); }
function renderEstimate() { $('#kEst').textContent = '≈ ' + eur(cakePrice()); }
$('#kDate').addEventListener('input', renderCakeTimes);
$('#kGf').addEventListener('change', renderEstimate);
$('#cakeForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, v = n => f.elements[n].value.trim(), err = $('#kErr'), c = cakeDateCheck();
  if (c.msg) { err.textContent = c.msg; err.hidden = false; return; }
  if (!c.ok || !v('time') || !v('name') || !v('phone')) { err.textContent = t('err_cake'); err.hidden = false; return; }
  err.hidden = true;
  const z = CAKES.sizes.find(s => s.id === size);
  const lines = [t('msg_cake'), `${t('msg_flavour')}: ${t('fl_' + flavour)}`, `${t('msg_size')}: ${t('sz_' + z.id)} (${t('sz_' + z.id + '_p')})`];
  if ($('#kGf').checked) lines.push(t('msg_gf'));
  if (v('text')) lines.push(`${t('msg_text')}: «${v('text')}»`);
  lines.push(`${t('msg_pick')}: ${longDay(c.d)}, ${v('time')}`, `${t('msg_name')}: ${v('name')}`, `${t('msg_phone')}: ${v('phone')}`, `${t('msg_est')}: ≈ ${eur(cakePrice())}`);
  resultBox($('#kRes'), lines.join('\n'));
});

/* ===== house, visit, footer ===== */
function renderHouse() {
  $('#route').innerHTML = t('route').map(c => `<li>${esc(c)}</li>`).join('');
  const icons = ['loaf', 'croissant', 'cake'];
  $('#team').innerHTML = [1, 2, 3].map(i => `<li><div class="ic">${art(icons[i - 1], icons[i - 1] === 'cake' ? '0 0 240 240' : '0 0 200 200')}</div><div><h3>${esc(t('t' + i + '_h'))}</h3><p>${esc(t('t' + i + '_p'))}</p></div></li>`).join('');
  $('#b2bLink').href = `https://www.instagram.com/${encodeURIComponent(SITE.instagram)}/`;
}
function renderVisit() {
  const d = today(), w = dow(d), order = [2, 3, 4, 5, 6, 0, 1];
  const hrs = `<div class="hrs">${order.map(i => { const dd = addDays(d, (i - w + 7) % 7), h = SITE.hours[i], cls = i === w ? 'today' : (h ? '' : 'off'); const n = dayName(dd, { weekday: 'long' }); return `<span class="${cls}">${esc(n.charAt(0).toUpperCase() + n.slice(1))}</span><span class="${cls}">${h ? `${hhmm(h[0], h[1])}–${hhmm(h[2], h[3])}` : esc(t('closed'))}</span>`; }).join('')}</div>`;
  $('#info').innerHTML = `<li><span class="k">${esc(t('k_addr'))}</span><span class="v">${esc(SITE.address)}</span></li>
    <li><span class="k">${esc(t('k_hours'))}</span><span class="v">${hrs}<small>${esc(statusText())}</small></span></li>
    <li><span class="k">${esc(t('k_ig'))}</span><span class="v"><a href="https://www.instagram.com/${encodeURIComponent(SITE.instagram)}/" target="_blank" rel="noopener">@${esc(SITE.instagram)}</a></span></li>`;
  $('#links').innerHTML = `<a class="btn" href="${SITE.mapsUrl}" target="_blank" rel="noopener">${esc(t('maps'))}</a><a class="btn line" href="#order">${esc(t('hdr_cta'))}</a>`;
  $('#fnav').innerHTML = `<a href="#menu">${esc(t('nav_menu'))}</a><a href="#cakes">${esc(t('nav_cakes'))}</a><a href="#house">${esc(t('nav_house'))}</a><a href="#visit">${esc(t('nav_visit'))}</a><a href="${SITE.studio}" target="_blank" rel="noopener">${esc(t('foot_by'))} ↗</a>`;
}
function renderStatus() {
  const s = status(), el = $('#status');
  el.classList.toggle('on', s.k === 'open');
  el.querySelector('span').textContent = statusText();
}

/* ===== i18n & boot ===== */
function applyTexts() {
  document.documentElement.lang = lang;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-th]').forEach(el => { el.innerHTML = t(el.dataset.th); });
  $$('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function renderAll() {
  applyTexts(); heroArt(); $('#cakeArt').innerHTML = cake(); renderStatus(); renderMenu(); renderCart(); renderDays(); renderCakeForm(); renderHouse(); renderVisit();
  $('#oRes').hidden = true; $('#kRes').hidden = true;
  $$('.glaze').forEach(glaze);
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('melt-lang', lang); } catch (e) {}
  renderAll();
}));
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => $$('.glaze').forEach(glaze), 150); });
renderAll();
setInterval(() => { renderStatus(); renderVisit(); renderDays(); }, 30000);
</script>
</body>
</html>
