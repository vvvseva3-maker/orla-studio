/* Layout: one cast-bronze object lit by a ring of light opens the page; everything after is quiet left-aligned type on warm black, with roman numerals marking the four rooms of the site. */
:root {
  --ink: #0c0b0a;
  --ink-2: #13110f;
  --ink-3: #1b1815;
  --line: #2c2722;
  --fg: #eee7dc;
  --muted: #9a8f83;
  --dim: #6b625a;
  --bronze: #b47c45;
  --gold: #e4ba6a;
  --gold-rgb: 228 186 106;
  --bronze-rgb: 180 124 69;
  --bezel: #2a2520;
  --ua-blue: #0057b7;
  --ua-yellow: #ffd700;
  --font-display: "Forum", "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Onest", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: clamp(1.5rem, 2.4vw, 1.9rem);
  --step-3: clamp(2.3rem, 5vw, 4rem);
  --step-4: clamp(2.9rem, 7.4vw, 6.6rem);
  --radius: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--font-body);

  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; border-radius: 2px; }
::selection { background: rgb(var(--gold-rgb) / .35); color: var(--fg); }
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -.005em; }

.eyebrow .n { color: var(--dim); }

.skip:focus { left: 12px; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; transition: background .3s ease, border-color .3s ease; border-bottom: 1px solid transparent; }
header.top.solid { background: rgb(12 11 10 / .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-color: var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 16px; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-family: var(--font-display); font-size: 1.7rem; line-height: 1; letter-spacing: .02em; }
.logo i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--gold); box-shadow: 0 0 12px rgb(var(--gold-rgb) / .45), inset 0 0 6px rgb(var(--gold-rgb) / .35); display: block; }
nav.main { display: flex; align-items: center; gap: 30px; }

}
.overlay { position: fixed; inset: 0; z-index: 70; background: var(--ink); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.overlay .wrap { width: 100%; }

/* hero: a client's site builds itself from a gold sketch as you scroll (I sketch → II design → III live) */
.hero { position: relative; height: 300vh; }
.pin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
.pin::before { content: ""; position: absolute; inset: -20% -10% auto 35%; height: 140%; background: radial-gradient(closest-side, rgb(var(--bronze-rgb) / .16), transparent 70%); pointer-events: none; }
.hero-grid { position: relative; z-index: 2; height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 76px 88px; pointer-events: none; }
.copy { pointer-events: auto; will-change: opacity, transform; }
.copy.gone { visibility: hidden; }
.slot { align-self: stretch; }
.hero h1 { font-size: var(--step-4); line-height: .98; margin-top: 22px; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero .lede { margin-top: 26px; max-width: 44ch; font-size: var(--step-1); color: var(--muted); line-height: 1.55; }
.hero .lede b { color: var(--fg); font-weight: 400; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
.btn { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 500 .98rem var(--font-body); padding: 15px 24px; border-radius: 99px; border: 1px solid transparent; cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .15s; }
.btn:active { transform: translateY(1px); }
.btn-gold { background: var(--gold); color: var(--ink); }
.btn-gold:hover { background: var(--fg); }
.btn-ghost { border-color: var(--line); color: var(--fg); }
.btn-ghost:hover { border-color: var(--gold); }
.btn .arr { transition: transform .2s; }
.btn:hover .arr { transform: translateX(3px); }

/* the device: a browser window on wide screens, a phone on narrow ones */
.rig { position: absolute; left: 0; top: 0; z-index: 1; transform-origin: 50% 50%; will-change: transform; }
.frame { position: relative; height: 100%; border-radius: 12px; overflow: hidden; background: var(--ink-3); box-shadow: 0 0 0 1px rgb(var(--gold-rgb) / .3), 0 50px 120px rgb(0 0 0 / .6), 0 0 90px rgb(var(--bronze-rgb) / .2); }
.chrome { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.chrome i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.chrome .url { margin-left: 14px; width: min(340px, 50%); height: 20px; border-radius: 99px; background: var(--ink); color: var(--muted); font: 400 10.5px var(--font-mono); letter-spacing: .04em; display: flex; align-items: center; gap: 7px; padding: 0 11px; overflow: hidden; white-space: nowrap; }
.chrome .url::before { content: ""; width: 6px; height: 7px; border: 1.3px solid var(--dim); border-radius: 1.5px; flex: none; }
.vp { position: relative; overflow: hidden; }
.frame.is-phone { border-radius: 42px; padding: 10px; background: linear-gradient(150deg, var(--bezel), var(--ink)); }
.frame.is-phone .chrome { display: none; }

/* the client's site, drawn at its own size and scaled to the device */
.mini { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; color: #efe8dc; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 400; line-height: 1.4;
  background-color: var(--ink-2);
  background-image: linear-gradient(rgb(var(--gold-rgb) / .075) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--gold-rgb) / .075) 1px, transparent 1px);
  background-size: 32px 32px; }
.mini .el { position: absolute; --t: 0; opacity: clamp(0, calc(var(--t) * 4), 1); clip-path: inset(-6px calc((1 - var(--t)) * 100%) -6px -6px); }
.mini .el.v { clip-path: inset(0 0 calc((1 - var(--t)) * 100%) 0); }
.mini .el::after { content: ""; position: absolute; top: -6px; bottom: -6px; left: calc(var(--t) * 100% - 3px); width: 3px; background: var(--gold); box-shadow: 0 0 16px 2px var(--gold); opacity: calc(var(--t) * (1 - var(--t)) * 4); pointer-events: none; }
.mini .el.v::after { top: calc(var(--t) * 100% - 3px); bottom: auto; left: 0; width: 100%; height: 3px; }
.mini .el.pop { clip-path: none; transform: translateY(calc((1 - var(--t)) * -18px)) scale(calc(.96 + var(--t) * .04)); }
.mini .el.pop::after { display: none; }
.mini .el.off { display: none; }
.mini .disp { font-family: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif; text-transform: uppercase; }

/* the sketch: gold hairlines that draw themselves, then give way element by element */
.sk { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 4; }
.sk g { transition: none; }
.sk path { fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sk path.soft { stroke: rgb(var(--gold-rgb) / .55); }
.sk path.dash { stroke-dasharray: 5 6; }
.sk text { fill: var(--gold); font: 500 11px var(--font-mono); letter-spacing: .14em; }
.sk text.note { fill: var(--fg); font: 400 14px var(--font-body); letter-spacing: 0; }
.sk rect.plate { fill: var(--ink-2); }
.sk.draw path.dr { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.15s cubic-bezier(.65, 0, .25, 1) forwards; animation-delay: calc(var(--d, 0) * 1ms); }
.sk.draw path.dash { opacity: 0; animation: fadein .6s ease forwards; animation-delay: calc(var(--d, 0) * 1ms + 300ms); }
.sk.draw text, .sk.draw rect.plate { opacity: 0; animation: fadein .5s ease forwards; animation-delay: calc(var(--d, 0) * 1ms + 700ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
.sk.m path { stroke-width: 1.4; }
.sk.m text { font-size: 9px; }

/* the three phases along the bottom */
.phases { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; opacity: 0; pointer-events: none; }
.phases .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 28px; align-items: end; padding-block: 0 24px; }
.ph { display: grid; gap: 9px; color: var(--dim); transition: color .3s; min-width: 0; }
.ph .lab { display: flex; gap: 10px; align-items: baseline; font: 500 .72rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.ph .lab span { color: var(--dim); transition: color .3s; }
.ph.on { color: var(--fg); }
.ph.on .lab span { color: var(--gold); }
.ph-track { position: relative; height: 1px; background: var(--line); }
.ph-fill { position: absolute; inset: 0; background: var(--gold); transform-origin: 0 50%; transform: scaleX(var(--f, 0)); box-shadow: 0 0 8px rgb(var(--gold-rgb) / .6); }
.ph p { font-size: .86rem; line-height: 1.45; color: var(--muted); min-height: 2.9em; opacity: 0; transition: opacity .35s; }
.ph.on p { opacity: 1; }
.demo-note { justify-self: end; display: grid; gap: 6px; justify-items: end; text-align: right; font: 400 .72rem var(--font-mono); letter-spacing: .06em; color: var(--dim); pointer-events: auto; }
.demo-note a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.demo-note a:hover { color: var(--gold); border-color: var(--gold); }
.cue { position: absolute; z-index: 3; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; font: 500 .68rem var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); white-space: nowrap; pointer-events: none; }
.cue::after { content: ""; width: 1px; height: 34px; background: linear-gradient(var(--gold), transparent); animation: cue 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

@media (max-width: 900px) {
  .hero { height: 280vh; }
  .hero-grid { grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; gap: 0; padding-block: 76px 0; }
  .hero h1 { margin-top: 14px; }
  .hero .lede { margin-top: 18px; }
  .ctas { margin-top: 26px; }
  .slot { height: 0; }
  .phases .wrap { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-block: 0 16px; }
  .ph p, .demo-note, .cue { display: none; }
  .ph .lab { font-size: .64rem; letter-spacing: .1em; gap: 6px; }
}
@media (max-width: 900px) and (max-height: 760px) {
  .hero .lede { font-size: 1.06rem; }
}

/* reduced motion: no pinning; the finished site sits on the tilted device */
.hero.static { height: auto; }
.hero.static .pin { position: relative; }
.hero.static .phases, .hero.static .cue { display: none; }
@media (prefers-reduced-motion: reduce) { .cue::after { animation: none; } .mini .el::after { display: none; } }


/* sections */
section.block { padding-block: 120px; border-top: 1px solid var(--line); }
@media (max-width: 760px) { section.block { padding-block: 76px; } }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: end; margin-bottom: 64px; }
.sec-head h2 { font-size: var(--step-3); line-height: 1.02; margin-top: 18px; }
.sec-head p { color: var(--muted); max-width: 46ch; justify-self: end; }
@media (max-width: 860px) { .sec-head { grid-template-columns: minmax(0, 1fr); margin-bottom: 44px; } .sec-head p { justify-self: start; } }

/* services */
.services { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.services > div { padding: 30px 28px 8px 0; min-width: 0; }
.services > div + div { padding-left: 28px; border-left: 1px solid var(--line); }
.services h3 { font-size: var(--step-2); line-height: 1.1; margin-bottom: 14px; }
.services p { color: var(--muted); font-size: .98rem; }
.services .mark { width: 30px; height: 30px; margin-bottom: 26px; color: var(--gold); }
@media (max-width: 1000px) {
  .services { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .services > div:nth-child(3) { padding-left: 0; border-left: 0; }
  .services > div:nth-child(n+3) { border-top: 1px solid var(--line); margin-top: 24px; }
}
@media (max-width: 600px) {
  .services { grid-template-columns: minmax(0, 1fr); }
  .services > div, .services > div + div { padding: 26px 0 4px; border-left: 0; }
  .services > div + div { border-top: 1px solid var(--line); margin-top: 22px; }
}

/* statement */
.statement { position: relative; overflow: hidden; padding-block: 150px; border-top: 1px solid var(--line); background: var(--ink-2); }
.statement::after { content: ""; position: absolute; width: min(70vw, 760px); aspect-ratio: 1; right: -18vw; top: 50%; transform: translateY(-50%); border-radius: 50%; border: 1px solid rgb(var(--gold-rgb) / .22); box-shadow: 0 0 80px rgb(var(--gold-rgb) / .06), inset 0 0 80px rgb(var(--gold-rgb) / .05); pointer-events: none; }
.statement .wrap { position: relative; z-index: 1; }
.statement h2 { font-size: clamp(2.2rem, 5.6vw, 4.8rem); line-height: 1.05; max-width: 17ch; }
.statement h2 .w { color: var(--dim); transition: color .45s ease; }
.statement h2 .w.lit { color: var(--fg); }
.statement p { margin-top: 32px; max-width: 46ch; color: var(--muted); font-size: var(--step-1); }
.statement .btn { margin-top: 36px; }
@media (max-width: 760px) { .statement { padding-block: 96px; } }

/* niches strip */
.niches { border-top: 1px solid var(--line); overflow: hidden; padding-block: 26px; }
.niches .track { display: flex; width: max-content; animation: drift 70s linear infinite; }
.niches ul { display: flex; list-style: none; margin: 0; padding: 0; }
.niches li { display: flex; align-items: center; gap: 44px; padding-right: 44px; white-space: nowrap; font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2.3rem); color: var(--dim); }
.niches li::after { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--gold); box-shadow: 0 0 8px rgb(var(--gold-rgb) / .5); }
@keyframes drift { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .niches .track { animation: none; } }

/* work: projects shown inside a phone */
.showcase { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 72px; align-items: start; }
.proj-list { display: grid; border-top: 1px solid var(--line); }
.proj { appearance: none; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--muted); text-align: left; padding: 22px 0 22px 26px; cursor: pointer; position: relative; display: grid; gap: 6px; font: inherit; text-decoration: none; transition: color .25s; }
.proj::before { content: ""; position: absolute; left: 0; top: 22px; bottom: 22px; width: 2px; background: var(--line); transition: background .3s, box-shadow .3s; }
.proj:hover { color: var(--fg); }
.proj[aria-selected="true"] { color: var(--fg); }
.proj[aria-selected="true"]::before { background: var(--gold); box-shadow: 0 0 12px rgb(var(--gold-rgb) / .6); }
.proj small { font: 500 .7rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.proj[aria-selected="true"] small { color: var(--gold); }
.proj b { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 2.8vw, 2.4rem); line-height: 1.05; }
.proj.next b { color: var(--gold); }
.proj-desc { margin-top: 26px; color: var(--muted); max-width: 46ch; min-height: 5em; }
.device { position: sticky; top: 96px; display: grid; gap: 16px; justify-items: center; }
.phone { position: relative; width: 300px; max-width: 100%; aspect-ratio: 300 / 616; border-radius: 46px; padding: 11px; background: linear-gradient(150deg, var(--bezel), var(--ink)); box-shadow: 0 0 0 1px rgb(var(--gold-rgb) / .3), 0 40px 80px rgb(0 0 0 / .55), 0 0 70px rgb(var(--bronze-rgb) / .2); }
.notch { position: absolute; top: 21px; left: 50%; transform: translateX(-50%); width: 84px; height: 22px; border-radius: 99px; background: var(--ink); z-index: 2; }
.screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--ink-2); scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
@media (hover: hover) { .screen { overflow-y: auto; } }
@media (prefers-reduced-motion: reduce) { .screen { overflow-y: auto; } }
.screen img { width: 100%; display: block; transition: opacity .3s ease; }
.screen img.swap { opacity: 0; }
.device-cap { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.scroll-hint { font: 400 .74rem var(--font-mono); color: var(--dim); text-align: center; max-width: 30ch; }
@media (max-width: 900px) {
  .showcase { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .proj-list { display: flex; gap: 8px; overflow-x: auto; border: 0; padding-bottom: 6px; scrollbar-width: none; }
  .proj-list::-webkit-scrollbar { display: none; }
  .proj { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 10px 16px; }
  .proj::before, .proj small { display: none; }
  .proj b { font-size: 1.15rem; white-space: nowrap; }
  .proj[aria-selected="true"] { border-color: rgb(var(--gold-rgb) / .7); }
  .proj-desc { margin-top: 18px; min-height: 0; }
  .device { position: static; }
  .phone { width: min(300px, 78vw); }
}

/* brief builder */
.needs { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }
.needs input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
.field .needs label { display: inline-flex; align-items: center; gap: 8px; font: 400 .9rem var(--font-body); letter-spacing: 0; text-transform: none; color: var(--muted); border: 1px solid var(--line); padding: 8px 14px; border-radius: 99px; cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
.field .needs label::before { content: "+"; font-family: var(--font-mono); color: var(--dim); }
.field .needs input:checked + label { color: var(--fg); border-color: rgb(var(--gold-rgb) / .6); background: var(--ink-3); }
.field .needs input:checked + label::before { content: "✓"; color: var(--gold); }
.field .needs input:focus-visible + label { outline: 1px solid var(--gold); outline-offset: 2px; }
.wire { margin-top: 40px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start; }
.wire-phone { width: 190px; border-radius: 28px; padding: 8px; background: var(--ink-3); border: 1px solid var(--line); }
.wire-screen { position: relative; border-radius: 21px; background: var(--ink); padding: 18px 9px 12px; display: grid; gap: 7px; align-content: start; min-height: 360px; }
.wb { border-radius: 6px; background: var(--ink-3); padding: 7px; display: grid; gap: 4px; transform-origin: top center; }
.wb.enter { animation: pop .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { transform: scaleY(.4); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .wb.enter { animation: none; } }
.wb small { font: 500 .5rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.wb .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.bar { height: 5px; border-radius: 3px; background: var(--line); }
.bar.gold { background: rgb(var(--gold-rgb) / .8); }
.w30 { width: 30%; } .w45 { width: 45%; } .w60 { width: 60%; } .w80 { width: 80%; } .w100 { width: 100%; }
.pillbtn { height: 11px; width: 46%; border-radius: 99px; background: var(--gold); }
.inbar { height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.g3 i { aspect-ratio: 1; background: var(--line); border-radius: 3px; display: block; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.g2 i { aspect-ratio: 1 / .8; background: var(--line); border-radius: 3px; display: block; }
.map { width: 26px; height: 26px; border-radius: 4px; background: var(--line); display: grid; place-items: center; flex: none; }
.map::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.stars { font-size: .6rem; color: var(--gold); letter-spacing: .1em; }
.wa-dot { position: absolute; right: 12px; bottom: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px rgb(var(--gold-rgb) / .6); }
.langs { font: 500 .5rem var(--font-mono); color: var(--gold); letter-spacing: .08em; }
.wire-cap { display: grid; gap: 8px; padding-top: 6px; }
.wire-cap b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; }
.wire-cap span { color: var(--muted); font-size: .92rem; }
@media (max-width: 420px) { .wire { grid-template-columns: minmax(0, 1fr); justify-items: start; } }

/* process */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; position: relative; }
.steps::before { content: ""; position: absolute; left: 22px; right: 0; top: 22px; height: 1px; background: linear-gradient(90deg, var(--gold), rgb(var(--gold-rgb) / .15)); }
.steps li { position: relative; min-width: 0; }
.steps .node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); border: 1px solid var(--gold); color: var(--gold); font: 500 .85rem var(--font-mono); position: relative; z-index: 1; }
.steps h3 { font-size: var(--step-2); line-height: 1.1; margin: 28px 0 12px; }
.steps p { color: var(--muted); font-size: .97rem; }
@media (max-width: 900px) {
  .steps { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .steps::before { left: 22px; right: auto; top: 22px; bottom: 22px; width: 1px; height: auto; background: linear-gradient(180deg, var(--gold), rgb(var(--gold-rgb) / .15)); }
  .steps li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 22px; }
  .steps h3 { margin: 8px 0 8px; }
  .steps p { grid-column: 2; }
}

/* contact */
.contact-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 72px; align-items: start; }
.contact-grid h2 { font-size: var(--step-3); line-height: 1.02; margin-top: 18px; }
.contact-grid .lede { margin-top: 24px; color: var(--muted); font-size: var(--step-1); max-width: 36ch; }
.mail { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.mail small { font: 500 .72rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.mail .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mail .addr { font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); user-select: all; word-break: break-all; }
.chip { appearance: none; background: transparent; border: 1px solid var(--line); color: var(--muted); font: 500 .72rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; border-radius: 99px; cursor: pointer; }
.chip:hover { color: var(--fg); border-color: var(--gold); }
form.project { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 20px; padding: 36px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field legend { font: 500 .72rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0; }
.field label .opt { color: var(--dim); text-transform: none; letter-spacing: 0; margin-left: 6px; }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; font: 400 1rem var(--font-body); color: var(--fg); background: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; appearance: none; transition: border-color .2s;
}
.field textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.field input::placeholder, .field textarea::placeholder { color: var(--dim); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 53%, calc(100% - 14px) 53%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
fieldset.field { border: 0; margin: 0; padding: 0; }
.seg { position: relative; display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 3px; width: max-content; max-width: 100%; }
.seg input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
.seg label { font: 500 .85rem var(--font-body); letter-spacing: 0; text-transform: none; color: var(--muted); padding: 8px 16px; border-radius: 99px; cursor: pointer; }
.seg input:checked + label { background: var(--ink-3); color: var(--fg); box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / .5); }
.seg input:focus-visible + label { outline: 1px solid var(--gold); outline-offset: 2px; }
.err { color: #f2a28f; font-size: .9rem; }
form.project .btn { justify-self: start; }
.result { grid-column: 1 / -1; border: 1px solid rgb(var(--gold-rgb) / .45); border-radius: var(--radius); padding: 22px; display: grid; gap: 12px; background: var(--ink); }
.result strong { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; color: var(--gold); }
.result p { color: var(--muted); }
.result textarea { width: 100%; min-height: 150px; font: 400 .9rem var(--font-mono); color: var(--fg); background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; resize: vertical; }
.result .row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 900px) { .contact-grid { grid-template-columns: minmax(0, 1fr); gap: 48px; } }
@media (max-width: 560px) { form.project { grid-template-columns: minmax(0, 1fr); padding: 22px; } }

footer { border-top: 1px solid var(--line); }
footer .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 32px; padding-block: 56px 48px; }
footer p { color: var(--muted); font-size: .95rem; margin-top: 14px; max-width: 34ch; }
footer h4 { margin: 0 0 12px; font: 500 .72rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: .95rem; }
footer ul a { text-decoration: none; color: var(--muted); }
footer ul a:hover { color: var(--fg); }
footer .base { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 22px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--dim); font: 400 .78rem var(--font-mono); letter-spacing: .04em; }
footer .email { user-select: all; word-break: break-all; }
.made { display: inline-flex; align-items: center; gap: 8px; }
.made i { width: 14px; height: 10px; border-radius: 2px; background: linear-gradient(var(--ua-blue) 50%, var(--ua-yellow) 50%); display: block; }
@media (max-width: 760px) { footer .wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } footer .wrap > div:first-child { grid-column: 1 / -1; } footer .wrap > div:nth-child(3) { grid-column: 1 / -1; } footer .email { word-break: normal; } }
</style>
</head>
<body>


<a class="skip" href="#main" data-t="skip"></a>

<header class="top" id="hdr">
  <div class="wrap">
    <a class="logo" href="#top"><i aria-hidden="true"></i><span data-studio="name"></span></a>
    <nav class="main" aria-label="Main">
      <div class="links">
        <a href="#what-we-do"><span class="num">I</span><span data-t="nav1"></span></a>
        <a href="#work"><span class="num">II</span><span data-t="nav2"></span></a>
        <a href="#process"><span class="num">III</span><span data-t="nav3"></span></a>
        <a href="#contact"><span class="num">IV</span><span data-t="nav4"></span></a>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="ru">RU</button>
      </div>
      <button class="menu-btn" id="menuOpen" type="button" aria-expanded="false" aria-controls="overlay" data-t="menu"></button>
    </nav>
  </div>
</header>

<div class="overlay" id="overlay" hidden>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#top" data-close><i aria-hidden="true"></i><span data-studio="name"></span></a>
      <button class="menu-btn" id="menuClose" type="button" data-t="close" style="display:inline-block"></button>
    </div>
    <ol>
      <li><a href="#what-we-do" data-close><span>I</span><b data-t="nav1" style="font-weight:400"></b></a></li>
      <li><a href="#work" data-close><span>II</span><b data-t="nav2" style="font-weight:400"></b></a></li>
      <li><a href="#process" data-close><span>III</span><b data-t="nav3" style="font-weight:400"></b></a></li>
      <li><a href="#contact" data-close><span>IV</span><b data-t="nav4" style="font-weight:400"></b></a></li>
    </ol>
    <div class="foot">
      <span class="email" data-studio="email"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="ru">RU</button>
      </div>

  </div>
</div>

<main id="main">
  <section class="hero" id="top">
    <div class="pin" id="pin">
      <div class="wrap hero-grid">
        <div class="copy" id="heroCopy">
          <span class="eyebrow" data-t="heroEyebrow"></span>
          <h1 data-t-html="heroTitle"></h1>
          <p class="lede" data-t-html="heroLede"></p>
          <div class="ctas">
            <a class="btn btn-gold" href="#contact"><span data-t="cta1"></span><span class="arr" aria-hidden="true">→</span></a>

    const p = Math.min(1, Math.max(0, (start - r.top) / (start - end + r.height * 0.5)));
    const n = matchMedia('(prefers-reduced-motion: reduce)').matches ? words.length : Math.round(p * words.length);
    words.forEach((w, i) => w.classList.toggle('lit', i < n));

    img.alt = (p.self ? S.name : p.name) + ' — ' + t[p.kind];

    const swap = () => { img.src = p.shot; img.dataset.src = p.shot; screen.scrollTop = 0; scrollPos = 0; holdUntil = performance.now() + 1500; img.classList.remove('swap'); };

  screenEl.addEventListener('wheel', () => { holdUntil = performance.now() + 3000; scrollPos = screenEl.scrollTop; }, { passive: true });
  function tick(now) {
    const dt = Math.min(64, now - lastTick); lastTick = now;
    if (!reduceMotion && screenVisible && !hovering && now > holdUntil) {
      const max = screenEl.scrollHeight - screenEl.clientHeight;
      if (max > 0) {
        if (Math.abs(screenEl.scrollTop - scrollPos) > 2) scrollPos = screenEl.scrollTop;
        scrollPos += dt * 0.045;
        if (scrollPos >= max) { scrollPos = 0; holdUntil = now + 1800; screenEl.scrollTo({ top: 0, behavior: 'smooth' }); }

    }
    requestAnimationFrame(tick);
  }

  const HERO = (() => {

    const lerp = (a, b, t) => a + (b - a) * t;
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const SIZE = { d: [1280, 800], m: [390, 800] };
    const PRICES = { d: [['Corte clássico', 15], ['Degradê', 18], ['Barba com toalha', 14], ['Corte e barba', 28]], m: [['Corte clássico', 15], ['Degradê', 18], ['Corte e barba', 28]] };
    /* the client's site: Barbearia Exemplo, one of our demos. Boxes are [x, y, w, h] on its wide (d) and narrow (m) layout. */
    const ELS = [
      { id: 'bg', kind: 'bg', v: true, d: [0, 0, 1280, 640], m: [0, 0, 390, 646] },
      { id: 'logo', kind: 'logo', label: 'LOGO', d: [64, 21, 300, 34], m: [18, 42, 230, 28], html: '<b>Barbearia Exemplo</b><small>desde 1987</small>' },
      { id: 'nav', kind: 'nav', label: 'NAV', d: [770, 25, 290, 26], m: null, html: '<span>Serviços</span><span>A casa</span><span>Visitar</span>' },
      { id: 'hbtn', kind: 'btn', d: [1096, 18, 120, 40], m: [292, 40, 80, 32], html: 'Marcar' },
      { id: 'eyebrow', kind: 'text', cls: 'mono', lines: [.66], d: [64, 122, 460, 20], m: [18, 106, 330, 16], html: 'Barbearia · Arroios, Lisboa' },
      { id: 'h1', kind: 'h1', label: 'H1', cls: 'disp', lines: [.82, .85, .84], d: [64, 156, 720, 290], m: [18, 130, 354, 164], html: 'Corte, barba<br>e <em>dois dedos</em><br><em>de conversa.</em>' },
      { id: 'lede', kind: 'text', label: 'TEXT', lines: [1, .97, .3], d: [64, 470, 540, 60], m: [18, 314, 350, 70], html: 'Três cadeiras, navalha a sério e toalha quente. Marque a sua hora ou passe pela porta quando houver cadeira livre.' },
      { id: 'btn1', kind: 'btn', label: 'CTA', d: [64, 556, 196, 54], m: [18, 404, 170, 48], html: 'Marcar cadeira' },
      { id: 'btn2', kind: 'btn', dashed: true, d: [274, 556, 150, 54], m: [200, 404, 140, 48], html: 'Ver preços' },
      { id: 'pole', kind: 'img', label: 'IMG', d: [890, 150, 66, 330], m: [26, 478, 40, 142], html: '<span class="cap"></span><span class="glass"><span class="stripes"></span></span><span class="cap"></span>' },
      { id: 'status', kind: 'card', label: 'LIVE', d: [990, 196, 226, 196], m: [84, 478, 288, 142], html: '<p class="st"><i></i>Aberto agora</p><p class="sub">Fecha hoje às 20:00</p><dl><dt>Cadeiras</dt><dd>3 barbeiros</dd><dt>Sem marcação</dt><dd>ter–sex, depois das 15h</dd></dl>' },
      { id: 'checker', kind: 'band', d: [0, 640, 1280, 26], m: [0, 646, 390, 22] },
      { id: 'prices', kind: 'list', label: 'PRICES', d: [0, 666, 1280, 134], m: [0, 668, 390, 132],
        html: l => '<small>Tabela de preços</small><ul>' + PRICES[l].map(([n, e]) => `<li><b>${n}</b><i></i><span>${e} €</span></li>`).join('') + '</ul>' },
      { id: 'toast', kind: 'toast', pop: true, d: [990, 96, 226, 90], m: [16, 92, 358, 80], html: '<p class="tt"><i></i>Novo pedido de marcação</p><p class="tb">Sábado, 11:30 · Corte e barba</p><p class="tc">pelo site · agora</p>' }
    ];
    // notes pencilled on the wide sketch: [key, text x, text y, leader from → to]
    const NOTES = [
      ['n1', 560, 137, [548, 132, 500, 168]],
      ['n2', 448, 589, [440, 583, 428, 583]],
      ['n3', 990, 182, null],
      ['n4', 300, 694, [292, 689, 250, 689]]
    ];
    let L = null, G = null, p = -1, raf = 0, drew = false, cursor = null;
    const nodes = {}, groups = {};

    const R = (x, y, w, h, r = 0) => r
      ? `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`
      : `M${x} ${y}H${x + w}V${y + h}H${x}Z`;
    const Ln = (x1, y1, x2, y2) => `M${x1} ${y1}L${x2} ${y2}`;
    function marks(el, [x, y, w, h]) {
      const P = [], add = (d, cls = '') => P.push([d, cls]);
      switch (el.kind) {
        case 'logo': { const c = h - 6; add(R(x, y + 3, c, c, c / 2)); add(R(x + c + 10, y + h / 2 - 6, w * .62, 12, 6)); break; }
        case 'nav': for (let i = 0; i < 3; i++) add(R(x + i * w / 3 + 10, y + h / 2 - 4, w / 3 - 26, 8, 4)); break;
        case 'btn': add(R(x, y, w, h, 6), el.dashed ? 'dash' : ''); add(R(x + w * .22, y + h / 2 - 4, w * .56, 8, 4), 'soft'); break;
        case 'text': { const lh = h / el.lines.length; el.lines.forEach((f, i) => add(Ln(x, y + lh * (i + .5), x + w * f, y + lh * (i + .5)), i ? 'soft' : '')); break; }
        case 'h1': { const lh = h / el.lines.length; el.lines.forEach((f, i) => add(R(x, y + i * lh + lh * .16, w * f, lh * .64, 6))); break; }
        case 'img': add(R(x, y, w, h, 4)); add(Ln(x, y, x + w, y + h), 'soft'); add(Ln(x + w, y, x, y + h), 'soft'); break;
        case 'card': add(R(x, y, w, h, 4)); add(R(x + 16, y + 20, 11, 11, 5.5)); add(R(x + 36, y + 20, w * .5, 11, 5.5));
          add(Ln(x + 16, y + 50, x + w * .62, y + 50), 'soft');
          for (let i = 0; i < 2; i++) { const ry = y + h - 44 + i * 22; add(Ln(x + 16, ry, x + 16 + w * .24, ry), 'soft'); add(Ln(x + 26 + w * .3, ry, x + w * .78, ry), 'soft'); }
          break;
        case 'band': add(R(x, y, w, h)); for (let i = 12; i + h < w; i += 26) add(Ln(x + i, y + h, x + i + h, y), 'soft'); break;
        case 'list': {
          const pad = L === 'd' ? 64 : 18, cols = L === 'd' ? 2 : 1, gap = 56, cw = (w - pad * 2 - gap * (cols - 1)) / cols;
          add(Ln(x + pad, y + 28, x + pad + (L === 'd' ? 150 : 120), y + 28));
          const rows = L === 'd' ? 2 : 3, rh = L === 'd' ? 46 : 42, y0 = y + (L === 'd' ? 66 : 56);
          for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
            const cx = x + pad + c * (cw + gap), ry = y0 + r * rh, nw = cw * (.36 + ((r + c) % 2) * .12);
            add(R(cx, ry - 7, nw, 14, 4)); add(Ln(cx + nw + 10, ry, cx + cw - 52, ry), 'dash'); add(Ln(cx + cw - 40, ry, cx + cw, ry));
          }
          break;
        }
      }
      return P;
    }
    function drawSketch() {
      const [W, H] = SIZE[L], t = T[lang];
      sk.setAttribute('width', W); sk.setAttribute('height', H); sk.setAttribute('viewBox', `0 0 ${W} ${H}`);
      sk.classList.toggle('m', L === 'm');
      let html = '';
      ELS.forEach((el, i) => {
        const b = el[L]; if (!b) return;
        const P = marks(el, b); if (!P.length && !el.label) return;
        const d0 = 150 + i * 75;
        html += `<g data-g="${el.id}">` + P.map(([d, cls], j) => `<path class="${cls.includes('dash') ? cls : 'dr ' + cls}" pathLength="1" d="${d}" style="--d:${d0 + j * 45}"/>`).join('');
        if (el.label) { const ly = b[1] > 18 ? b[1] - 7 : b[1] + b[3] + 14; html += `<text x="${b[0]}" y="${ly}" style="--d:${d0}">${el.label}</text>`; }
        html += '</g>';
      });
      if (L === 'd') {
        html += '<g data-g="notes">' + NOTES.map(([k, x, y, ln], i) =>
          (ln ? `<path class="dr soft" pathLength="1" d="${Ln(...ln)}" style="--d:${1300 + i * 120}"/>` : '') +
          `<rect class="plate" x="${x - 6}" y="${y - 15}" height="21" rx="3" style="--d:${1300 + i * 120}"/><text class="note" x="${x}" y="${y}" style="--d:${1300 + i * 120}">${t[k]}</text>`).join('') + '</g>';
      }
      sk.innerHTML = html;
      sk.classList.toggle('draw', !drew && !reduce);
      drew = true;
      $$('g[data-g]', sk).forEach(g => { groups[g.dataset.g] = g; });
      $$('text.note', sk).forEach(tx => { const pl = tx.previousElementSibling; try { pl.setAttribute('width', tx.getComputedTextLength() + 12); } catch (e) { pl.setAttribute('width', tx.textContent.length * 7.4 + 12); } });
    }
    function build(nl) {
      L = nl;
      mini.dataset.l = L;
      mini.style.setProperty('--hb', L === 'd' ? '76px' : '86px');
      frame.classList.toggle('is-phone', L === 'm');
      mini.innerHTML = '';
      for (const k in nodes) delete nodes[k];
      for (const k in groups) delete groups[k];
      ELS.forEach(el => {
        const b = el[L]; if (!b) return;
        const n = document.createElement('div');
        n.className = `el m-${el.id}` + (el.v ? ' v' : '') + (el.pop ? ' pop' : '') + (el.cls ? ' ' + el.cls : '');
        n.style.cssText = `left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px`;
        n.innerHTML = typeof el.html === 'function' ? el.html(L) : (el.html || '');
        mini.append(n); nodes[el.id] = n;
      });
      cursor = document.createElement('div');
      cursor.className = 'm-cursor';
      cursor.innerHTML = L === 'd'
        ? '<svg viewBox="0 0 26 26" width="26" height="26"><path d="M4 2.5l17 10-7.3 1.7 4.4 8-3.2 1.7-4.4-8.1-5.3 5z" fill="#fff" stroke="#13110f" stroke-width="1.4" stroke-linejoin="round"/></svg>'
        : '<svg viewBox="0 0 26 26" width="26" height="26"><circle cx="13" cy="13" r="10.5" fill="rgb(255 255 255 / .28)" stroke="#fff" stroke-width="2"/></svg>';
      mini.append(cursor);
      drawSketch();
    }
    function layout() {
      const vw = innerWidth, vh = innerHeight, mob = vw <= 900;
      if ((mob ? 'm' : 'd') !== L) build(mob ? 'm' : 'd');
      const [W, H] = SIZE[L], chrome = mob ? 0 : 34, bez = mob ? 10 : 0;
      const top = mob ? 70 : 84, bottom = mob ? 56 : (vh < 760 ? 96 : 116), availH = vh - top - bottom;
      let fw = mob ? Math.min(vw - 48, 330, (availH - 2 * bez) * W / H + 2 * bez) : Math.min(1160, vw * .86, (availH - chrome) * W / H);
      const k = (fw - 2 * bez) / W, fh = H * k + chrome + 2 * bez;
      G = { fw, fh, fx: (vw - fw) / 2, fy: top + (availH - fh) / 2, mob };
      Object.assign(rig.style, { width: fw + 'px', height: fh + 'px', left: G.fx + 'px', top: G.fy + 'px' });
      vp.style.height = mob ? '' : (fh - chrome) + 'px';
      Object.assign(mini.style, { width: W + 'px', height: H + 'px', transform: `scale(${k})` });
      sk.style.transformOrigin = '0 0'; sk.style.transform = `scale(${k})`;
      const s = slot.getBoundingClientRect(), pr = pin.getBoundingClientRect();
      if (!mob) {
        const w0 = Math.min(s.width * 1.2, 860);
        G.s0 = w0 / fw; G.x0 = s.left - pr.left + s.width / 2 + 34; G.y0 = s.top - pr.top + s.height / 2 - 6; G.r0 = [12, -24, 2];
      } else {
        const w0 = Math.min(vw * .62, 250);
        G.s0 = w0 / fw; G.x0 = vw / 2 + 8; G.y0 = s.top - pr.top + 26 + fh * G.s0 / 2; G.r0 = [34, 0, -7];
      }
      if (reduce) hero.classList.add('static');
      update(true);
    }
    function progress() {
      const span = hero.offsetHeight - innerHeight;
      return span > 0 ? clamp(-hero.getBoundingClientRect().top / span) : 0;
    }
    function update(force) {
      if (!G) return;
      const np = reduce ? 0 : progress();
      if (!force && Math.abs(np - p) < .0004) return;
      p = np;
      const e = ease(clamp(p / .3));
      const tx = lerp(G.x0 - (G.fx + G.fw / 2), 0, e), ty = lerp(G.y0 - (G.fy + G.fh / 2), 0, e), sc = lerp(G.s0, 1, e);
      const [ax, ay, az] = G.r0.map(a => (a * (1 - e)).toFixed(2));
      rig.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) perspective(1800px) rotateX(${ax}deg) rotateY(${ay}deg) rotateZ(${az}deg) scale(${sc.toFixed(4)})`;
      const c = ease(clamp(p / .13));
      copy.style.opacity = (1 - c).toFixed(3);
      copy.style.transform = c ? `translateY(${(-48 * c).toFixed(1)}px)` : '';
      copy.classList.toggle('gone', c > .98);
      ELS.forEach((el, i) => {
        const n = nodes[el.id]; if (!n) return;
        const t = reduce ? 1 : el.id === 'toast' ? clamp((p - .885) / .06) : clamp((p - (.24 + i * .036)) / .1);
        n.style.setProperty('--t', t.toFixed(3));
        const g = groups[el.id]; if (g) g.style.opacity = (1 - t).toFixed(3);
      });
      if (groups.notes) groups.notes.style.opacity = reduce ? 0 : (1 - clamp((p - .2) / .06)).toFixed(3);
      mini.classList.toggle('live', reduce || p > .84);
      // the visitor's tap on "Marcar cadeira"
      const b1 = ELS[7][L], [W, H] = SIZE[L];
      const tx1 = b1[0] + b1[2] * .62, ty1 = b1[1] + b1[3] * .58, m = ease(clamp((p - .8) / .07));
      const cx = lerp(W * (L === 'd' ? .6 : .7), tx1, m), cy = lerp(H * (L === 'd' ? .9 : .7), ty1, m);
      const off = L === 'd' ? 0 : 13;
      cursor.style.transform = `translate(${(cx - off).toFixed(1)}px, ${(cy - off).toFixed(1)}px)`;
      cursor.style.opacity = reduce ? 0 : (clamp((p - .79) / .02) * (1 - clamp((p - .97) / .03))).toFixed(3);
      nodes.btn1.classList.toggle('press', !reduce && p > .872 && p < .9);
      // phases
      const f = [clamp(p / .22), clamp((p - .24) / .54), clamp((p - .8) / .14)], on = p < .24 ? 0 : p < .8 ? 1 : 2;
      phs.forEach((ph, i) => { ph.style.setProperty('--f', f[i].toFixed(3)); ph.classList.toggle('on', i === on); });
      phases.style.opacity = clamp((p - .012) / .04).toFixed(3);
      cue.style.opacity = (1 - clamp(p / .025)).toFixed(3);
    }
    const tick = () => { raf = 0; update(false); };
    addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); if (L === 'd') $$('text.note', sk).forEach(tx => { try { tx.previousElementSibling.setAttribute('width', tx.getComputedTextLength() + 12); } catch (e) {} }); });
    return {
      init: layout,
      relabel() { if (L) { drawSketch(); update(true); } }
    };
  })();

  apply();
  onScroll();
  HERO.init();
})();
